name: Release Cloud Assistant

# 云版助手发版：推 `cloud-v*` tag 触发。
# 双端构建（Windows NSIS + macOS zip ×2 架构）→ **各任务直接上传到本仓自己的 Release**。
#
# ⛔⛔⛔ 10-12：**发布目标从桌面版仓改回本仓**（`codex-harness-cloud-src`）。
#   起因是私有仓 Actions 分钟耗尽：额度用尽时作业**秒失败且拿不到 runner**
#   （`runner=(未分配)` + `步骤数=0`），表现为「推了 tag 却什么都没发生」，极难自查。
#   本仓 10-12 已转公开 ⇒ 吃免费 Actions 分钟，与桌面版仓零牵连。
#   收益：① 两条产品线彻底解耦（任一边发布/撤版都不影响另一边）；
#        ② **不再需要跨仓 PAT**（`CLOUD_RELEASE_TOKEN` 可以删掉了）——
#           本仓发本仓用默认 `GITHUB_TOKEN` 即可，`permissions: contents: write` 就够。
# ⛔⛔ 为什么不用 artifact 中转（10-11 实测踩坑）：GitHub Actions artifact 存储配额
#   （免费账户 500MB，一次三端就是 ~2GB）打满后上传直接失败，且**配额 6-12 小时才重算**
#   —— 删掉旧 artifact 也救不了当次运行（历史已挂两轮）。Release 资产不受该配额限制，
#   所以让每个构建任务直接 gh release upload，不经过 artifact。
# ⛔ 版本号：tag 必须是 cloud-vX.Y.Z；包版本与主入口在 electron-builder.assistant.yml 的
#   extraMetadata 里钉死（仓库 package.json 版本属于桌面版发布线，两者互不污染）。
on:
  push:
    tags:
      - "cloud-v*"
  workflow_dispatch:

# ⛔ 10-12：自发布 ⇒ 只需本仓 contents:write（原先跨仓要靠 PAT 才能写别人家仓）
permissions:
  contents: write

# 上传串行化：三个任务同时往同一个 Release 塞资产会撞车
concurrency:
  group: release-cloud-upload
  cancel-in-progress: false

env:
  ASSISTANT_VERSION: "0.0.7"
  # ⛔ 本仓自己（10-12）。发本仓不需要 PAT：默认 GITHUB_TOKEN + contents:write 即可。
  PUBLIC_REPO: PMZPZM0/codex-harness-cloud-src

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron + vite)
        run: npm run build

      - name: Package assistant (NSIS)
        run: npx electron-builder --win nsis --config electron-builder.assistant.yml --publish never
        env:
          # 精简包形态：随包自动化工具链（nuphus/playwright）不内置 —— before-pack 的官方逃生阀
          AUTOMATION_ZIP_OPTIONAL: "1"
          CODEBUDDY_SAFE_DELETE_ENABLED: "0"

      - name: 上传 Windows 安装包到本仓 Release（⛔ 10-12 自发布）
        shell: bash
        env:
          # 自发布用默认 GITHUB_TOKEN 即可（permissions 已给 contents:write）。
          # ⛔ 不再需要跨仓 PAT —— 仓库设置里的 secrets.CLOUD_RELEASE_TOKEN 可以删掉了。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${ASSISTANT_VERSION}"
          TAG="cloud-v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "${NOTES}" ]; then echo "::error::缺少更新说明 ${NOTES}"; exit 1; fi
          ASSET=$(find release-cloud -maxdepth 1 -type f -name "*.exe" | head -1)
          [ -n "${ASSET}" ] || { echo "::error::没找到 exe 产物"; exit 1; }
          NAME="CodexHarnessAssistant-${VERSION}-win-x64-setup.exe"
          sha256sum "${ASSET}" | tee "sha256-${NAME}.txt"
          if gh release view "${TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${PUBLIC_REPO}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" --repo "${PUBLIC_REPO}" --title "Codex Harness Assistant ${VERSION}" --notes-file "${NOTES}"
          fi
          cp "${ASSET}" "${NAME}"
          gh release upload "${TAG}" "${NAME}" "sha256-${NAME}.txt" --repo "${PUBLIC_REPO}" --clobber

  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron + vite)
        run: npm run build

      - name: Package assistant (mac zip)
        run: npx electron-builder --mac zip --config electron-builder.assistant.yml --publish never
        env:
          AUTOMATION_ZIP_OPTIONAL: "1"
          CODEBUDDY_SAFE_DELETE_ENABLED: "0"

      - name: 上传 macOS 包到本仓 Release（⛔ 10-12 自发布）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${ASSISTANT_VERSION}"
          TAG="cloud-v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          ASSET=$(find release-cloud -maxdepth 1 -type f -name "*.zip" | head -1)
          [ -n "${ASSET}" ] || { echo "::error::没找到 zip 产物"; exit 1; }
          NAME="CodexHarnessAssistant-${VERSION}-${{ matrix.arch }}-mac.zip"
          sha256sum "${ASSET}" | tee "sha256-${NAME}.txt"
          # Release 可能还没建（win 任务先跑完会建）—— 没建就等一手再建
          for i in $(seq 1 12); do
            gh release view "${TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1 && break
            echo "等待 Release ${TAG} 被创建…（${i}/12）"; sleep 20
          done
          if ! gh release view "${TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${PUBLIC_REPO}" --title "Codex Harness Assistant ${VERSION}" --notes-file "${NOTES}"
          fi
          cp "${ASSET}" "${NAME}"
          gh release upload "${TAG}" "${NAME}" "sha256-${NAME}.txt" --repo "${PUBLIC_REPO}" --clobber