name: Release Cloud Assistant

# 云版助手发版：推 `cloud-v*` tag 触发（与桌面版 release.yml 的 `v*` 触发互不干扰）。
# 双端构建（Windows NSIS + macOS zip）→ 发布到**公开仓** PMZPZM0/codex-harness-desktop 的
# 同名 Release。跨仓发布需要私有仓配 secret `CLOUD_RELEASE_TOKEN`（有 codex-harness-desktop
# contents:write 权限的 PAT）—— 与 PPcode 的 PPCODE_RELEASE_TOKEN 同一模式。
#
# ⛔ 版本号：tag 必须是 cloud-vX.Y.Z，构建时用 extraMetadata 把包版本钉成 X.Y.Z
#   （仓库 package.json 版本属于桌面版发布线，两者互不污染）。
on:
  push:
    tags:
      - "cloud-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cloud-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSISTANT_VERSION: "0.0.1"

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron + vite)
        run: npm run build

      - name: Package assistant (NSIS)
        run: env:/n          AUTOMATION_ZIP_OPTIONAL: "1"
        npx electron-builder --win nsis --config electron-builder.assistant.yml --publish never
        env:
          # 包版本钉成助手自己的版本线（不随桌面版 package.json 走）
          EB_EXTRA_METADATA: '{"main":"dist-electron/headless.js","version":"0.0.1"}'

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-win-x64
          path: |
            release-cloud/*.exe
          if-no-files-found: error

  build-mac:
    strategy:
      matrix:
        runner: [macos-latest, macos-13]   # arm64 + x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron + vite)
        run: npm run build

      - name: Package assistant (mac zip)
        run: env:/n          AUTOMATION_ZIP_OPTIONAL: "1"
        npx electron-builder --mac zip --config electron-builder.assistant.yml --publish never -c.extraMetadata.main=dist-electron/headless.js -c.extraMetadata.version=0.0.1

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-mac-${{ matrix.runner == 'macos-latest' && 'arm64' || 'x64' }}
          path: |
            release-cloud/*.zip
          if-no-files-found: error

  publish:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验 tag 与版本 + 组装资产（规范化命名）
        shell: bash
        env:
          VERSION: ${{ env.ASSISTANT_VERSION }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "cloud-v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与助手版本 ${VERSION} 不一致——改 ASSISTANT_VERSION 或用对应 tag"
            exit 1
          fi
          mkdir -p dist-assets
          pick() {
            local dir="$1" pattern="$2" out="$3"
            local found=()
            while IFS= read -r file; do found+=("$file"); done < <(find "$dir" -type f -name "$pattern" | sort)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::${dir} 下匹配 ${pattern} 的文件有 ${#found[@]} 个（应恰好 1 个）"
              printf '  %s\n' "${found[@]}"
              exit 1
            fi
            cp "${found[0]}" "dist-assets/${out}"
          }
          pick artifacts/cloud-win-x64   '*.exe' "CodexHarnessAssistant-${VERSION}-win-x64-setup.exe"
          pick artifacts/cloud-mac-arm64 '*.zip' "CodexHarnessAssistant-${VERSION}-arm64-mac.zip"
          pick artifacts/cloud-mac-x64   '*.zip' "CodexHarnessAssistant-${VERSION}-x64-mac.zip"
          echo "=== 待发布资产 ==="
          (cd dist-assets && sha256sum ./* | tee ../assets-sha256.txt && ls -l)

      - name: 发布到公开仓 PMZPZM0/codex-harness-desktop（cloud-v0.0.1 Release）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLOUD_RELEASE_TOKEN }}
          VERSION: ${{ env.ASSISTANT_VERSION }}
        run: |
          set -euo pipefail
          REPO="PMZPZM0/codex-harness-desktop"
          TAG="cloud-v${VERSION}"
          NOTES="docs/releases/cloud-v${VERSION}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "::error::缺少更新说明 ${NOTES}"
            exit 1
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "release ${TAG} 已存在 → 更新资产与说明（可重跑）"
            gh release edit "${TAG}" --repo "${REPO}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" --repo "${REPO}" --title "Codex Harness Assistant ${VERSION}" --notes-file "${NOTES}"
          fi
          gh release upload "${TAG}" dist-assets/* --repo "${REPO}" --clobber
          if [ "$(gh release view "${TAG}" --repo "${REPO}" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "${TAG}" --repo "${REPO}" --draft=false
          fi
          echo "=== 线上资产核对 ==="
          gh release view "${TAG}" --repo "${REPO}" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) B")'
