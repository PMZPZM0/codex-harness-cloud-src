<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Codex Harness Cloud</title>
<!--
  ⛔ 这个外壳由**本地伴生服务**下发（http://127.0.0.1:8917/），它不是界面本身：
     它只回答两个问题 ——「资产去哪拿」和「拿不到怎么办」。

  资产选址是**确定性**的（见下面的 bootstrap）：先问云端 `version.json` 在不在，
  在就用云端、不在/超时就整份用本地副本。⇒ 换界面 = 重新部署云端资源，用户不用重装。

  ⛔⛔ 为什么要先探测、而不是"先插云端标签、失败再换本地"：后者依赖 <link> 的 error
     事件，而**它根本不可靠** —— 云端返回的 404 是 JSON 而非 CSS 时，Chromium 不一定
     触发 error，于是页面带着一张**空样式表**渲染出来：布局全塌、颜色全丢，而控制台
     只有一条"跨源 cssRules 不可读"。走查台实测撞到过（appDisplay=block、
     gridTemplateColumns=none）。"静默无样式"比"报错"危险得多，所以选址必须前置。

  ⛔ 云端的模块脚本与 version.json 都是**跨源**请求：托管方必须回
     `Access-Control-Allow-Origin`（ES module 永远按 CORS 模式抓取，这条躲不掉）。
     缺这个头时 fetch 会失败 ⇒ 自动走本地副本，界面照常可用。
-->
<style>
  /* 外壳自带的极简首屏样式：资产到达前不能白屏，也不能跳版 */
  html, body { margin: 0; height: 100%; background: #1b1b1a; color: #ececea; }
  html[data-theme="light"], html[data-theme="light"] body { background: #fff; color: #23231f; }
  body { font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #boot { padding: 32px; color: inherit; }
  #boot[hidden] { display: none; }
  #boot .mark { font-weight: 600; letter-spacing: .01em; }
  #boot .sub { margin-top: 6px; font-size: 12.5px; opacity: .7; }
  #boot .err { margin-top: 14px; font-size: 12.5px; color: #ec7a70; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="boot">
  <div class="mark">Codex Harness Cloud</div>
  <div class="sub" id="boot-sub">正在连接本地伴生服务…</div>
  <div class="err" id="boot-err" hidden></div>
</div>

<script>
  // 主题在资产到达前先定下来，避免"先亮后暗"的闪一下
  try {
    var savedTheme = localStorage.getItem("chc-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch (e) { /* 隐私模式下 localStorage 可能抛异常，忽略 */ }

  window.__CHC_SHELL__ = {
    protocolVersion: __PROTOCOL_VERSION__,
    agentVersion: "__AGENT_VERSION__",
    cdnBase: "__CDN_BASE__",
  };

  (function () {
    var CDN = "__CDN_BASE__";
    var LOCAL = "/local-assets";
    var V = "__ASSET_VERSION__";
    var sub = document.getElementById("boot-sub");
    var started = false;
    var probeTimer = setTimeout(function () { start(LOCAL, "local"); }, 2500);

    function start(base, mode) {
      if (started) return;
      started = true;
      clearTimeout(probeTimer);
      window.__CHC_ASSET_BASE__ = base;
      if (sub) {
        sub.textContent = mode === "cloud"
          ? "正在载入界面…"
          : "云端资源不可达，已切到本地副本（界面能正常用，但不会自动更新）";
      }

      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = base + "/styles.css?v=" + V;
      document.head.appendChild(link);

      var script = document.createElement("script");
      script.type = "module";
      script.src = base + "/app.js?v=" + V;
      // 兜底仍保留（选了云端却抓不下来时改走本地），但它不再是**主**判定路径
      script.onerror = function () {
        if (base === LOCAL) {
          var err = document.getElementById("boot-err");
          if (err) { err.hidden = false; err.textContent = "界面资源加载失败：连本地副本都读不到。请确认伴生服务在运行。"; }
          return;
        }
        started = false;
        start(LOCAL, "local");
      };
      document.head.appendChild(script);

      // 脚本"卡住"（既没成功也没报错）时也给一次本地机会，避免永久停在首屏
      setTimeout(function () {
        if (!window.__chcReady && base !== LOCAL) { started = false; start(LOCAL, "local"); }
      }, 6000);
    }

    // ⛔ 选址探测只问一个**极小**的 version.json：用 fetch 是因为它的失败是明确可判的
    //   （浏览器不会"假装成功"），而 <link>/<script> 的 error 事件会漏。
    fetch(CDN + "/version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (response) { if (!response.ok) throw new Error("HTTP " + response.status); return response.json(); })
      .then(function () { start(CDN, "cloud"); })
      .catch(function () { start(LOCAL, "local"); });
  })();

  // 供 app.js 在就绪后调：把外壳自带的首屏提示收掉
  window.__chcHideBoot = function () {
    var boot = document.getElementById("boot");
    if (boot) boot.hidden = true;
  };
</script>
</body>
</html>
