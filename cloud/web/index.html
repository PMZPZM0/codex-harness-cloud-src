<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Codex Harness Cloud</title>
<!--
  这个外壳**同一份文件在三个地方都能用**，靠运行时判断，不靠服务端替换占位符：
    ① 云端：https://ppz123.asia/cloud/          ← 用户直接敲网址进来的入口
    ② 本机：http://127.0.0.1:8917/              ← 伴生服务下发（同源，最省事）
    ③ 离线：伴生服务在云端资产拿不到时给你本地副本

  ⛔⛔ 之前这文件里写着 `__CDN_BASE__` / `__PROTOCOL_VERSION__` 之类的占位符，**只有本地服务端会替换**，
     云端原样下发就出事了：`fetch("__CDN_BASE__/version.json")` 必然失败 → 回落 `/local-assets`（云端 404）
     → 界面永远停在"正在连接本地伴生服务…"，而且**首屏没有超时**，就那样一直转。
     教训：能被云端原样托管的文件，**必须自己就能跑**，不许依赖只有某一侧才会做的替换。
     服务端现在改为**注入** `window.__CHC_CDN__`（可选覆盖），文件里不再有占位符。

  ⛔ 跨源两件事，缺一不可（云端页面要连本机 127.0.0.1）：
     ① 伴生服务要回 CORS 头（Origin 白名单里要有 https://ppz123.asia）；
     ② 要承诺 `Access-Control-Allow-Private-Network: true`（Chrome 的私有网络访问预检）。
-->
<style>
  /* 外壳自带的首屏样式：资产到达前不能白屏，也不能跳版 */
  html, body { margin: 0; height: 100%; background: #1b1b1a; color: #ececea; }
  html[data-theme="light"], html[data-theme="light"] body { background: #fff; color: #23231f; }
  body { font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #boot { padding: 32px; color: inherit; }
  #boot[hidden] { display: none; }
  #boot .mark { font-weight: 600; letter-spacing: .01em; }
  #boot .sub { margin-top: 6px; font-size: 12.5px; opacity: .72; }
  #gate { max-width: 640px; margin: 48px auto; padding: 26px 28px; border-radius: 14px;
        border: 1px solid #ffffff1f; background: #ffffff0a; }
html[data-theme="light"] #gate { border-color: #00000014; background: #00000005; }
  #gate h1 { font-size: 16px; margin: 0 0 10px; }
  #gate p { font-size: 13px; margin: 0 0 14px; opacity: .85; }
  #gate code, #gate pre {
    font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    background: #ffffff14; border: 1px solid #ffffff1f; border-radius: 8px;
  }
  html[data-theme="light"] #gate code, html[data-theme="light"] #gate pre { background: #00000008; border-color: #00000012; }
  #gate code { padding: 1px 5px; }
  #gate pre { padding: 10px 12px; overflow: auto; }
  #gate .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  #gate button {
    appearance: none; -webkit-appearance: none; font: inherit;
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid #ffffff2e; background: #ffffff12; color: inherit;
  }
  #gate button:hover { background: #ffffff1f; }
  #gate input {
    appearance: none; -webkit-appearance: none; font: inherit;
    padding: 7px 10px; border-radius: 8px; width: 190px;
    border: 1px solid #ffffff2e; background: #ffffff0f; color: inherit;
  }
  #gate .why { font-size: 12px; opacity: .6; margin-top: 12px; }

  /* ── 登录门（connector 模式：网页只负责连接本地，界面由本机提供）──────────── */
  #login {
    max-width: 400px; margin: 9vh auto 0; padding: 28px 28px 22px;
    border-radius: 14px; border: 1px solid #ffffff1f; background: #ffffff0a;
  }
  html[data-theme="light"] #login { border-color: #00000014; background: #00000005; }
  #login .brand { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  #login .brand em { font-style: normal; font-weight: 400; font-size: 12px; opacity: .6; margin-left: 6px; }
  #login .desc { font-size: 12.5px; opacity: .75; margin: 0 0 16px; line-height: 1.7; }
  #login label { display: block; font-size: 12px; opacity: .8; margin-bottom: 6px; }
  #login .code {
    appearance: none; -webkit-appearance: none; font: inherit;
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #ffffff2e; background: #ffffff0f; color: inherit;
    font-family: ui-monospace, Consolas, monospace; letter-spacing: .12em; font-size: 15px;
  }
  html[data-theme="light"] #login .code { border-color: #0000002e; background: #00000008; }
  #login .code:focus { outline: 0; border-color: #2f6bdd; }
  html[data-theme="light"] #login .code:focus { border-color: #2f6bdd; }
  #login .go {
    appearance: none; -webkit-appearance: none; font: inherit;
    width: 100%; margin-top: 12px; padding: 9px 0; border-radius: 8px; cursor: pointer;
    border: 0; background: #1a7f37; color: #fff; font-weight: 600; font-size: 13.5px;
  }
  html[data-theme="light"] #login .go { background: #1a7f37; color: #fff; }
  #login .go:hover { filter: brightness(1.08); }
  #login .go:disabled { opacity: .55; cursor: default; }
  #login .status { font-size: 12px; margin: 10px 0 0; min-height: 18px; }
  #login .status.warn { color: #f0a35c; }
  #login .status.bad { color: #ec7a70; }
  #login .why { font-size: 11.5px; opacity: .55; margin-top: 14px; line-height: 1.7; }

  /* 账号步（登录/注册）与步骤指示 */
  #login .steps { display: flex; gap: 6px; margin-bottom: 14px; font-size: 11px; }
  #login .steps .st { padding: 3px 9px; border-radius: 999px; border: 1px solid #ffffff1f; opacity: .55; }
  #login .steps .st.on { border-color: #4c8df6; opacity: 1; color: #7cabf8; }
  html[data-theme="light"] #login .steps .st { border-color: #00000014; }
  #login .alt { margin-top: 10px; font-size: 12px; text-align: center; }
  #login .alt a { color: #7cabf8; cursor: pointer; text-decoration: underline; }
  html[data-theme="light"] #login .alt a { color: #2f6bdd; }
  #login .acct { font-size: 12px; opacity: .7; margin: -6px 0 14px; }
  #login .acct b { color: inherit; opacity: 1; }
  #login .out { font-size: 11.5px; margin-top: 12px; text-align: right; }
  #login .out a { cursor: pointer; text-decoration: underline; opacity: .7; }
</style>
</head>
<body>
<div id="boot">
  <div class="mark">Codex Harness Cloud</div>
  <div class="sub" id="boot-sub">正在连接本地伴生服务…</div>
</div>

<div id="login" hidden></div>

<div id="gate" hidden></div>

<script>
  // 主题在资产到达前先定下来，避免"先亮后暗"的闪一下
  try {
    var savedTheme = localStorage.getItem("chc-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch (e) { /* 隐私模式下 localStorage 可能抛异常，忽略 */ }
</script>

<script>
(function () {
  "use strict";
  var V = "0.1.0";                       // 资产版本戳，只用于缓存击穿
  var DEFAULT_PORT = 8917;
  var AGENT_PROBE_MS = 1200;             // 单个候选地址的探测超时
  var ASSET_PROBE_MS = 1800;             // 云端资产探测超时
  var READY_TIMEOUT_MS = 8000;           // 资产插进去后多久还没就绪就报错

  var boot = document.getElementById("boot");
  var sub = document.getElementById("boot-sub");
  var gate = document.getElementById("gate");
  var login = document.getElementById("login");
  var started = false;

  /* ── 模式判定 ──────────────────────────────────────────────────────────────
     ⛔ 由服务端注入 __CHC_MODE__（本机下发 = "full"）。云端原样托管拿不到注入
        ⇒ connector：网页**只负责连接本地** —— 渲染登录门，配对成功后把人送到
        本机伴生服务的界面（界面本身由桌面助手提供，网页不装、不仿）。 */
  var MODE = window.__CHC_MODE__ === "full" ? "full" : "connector";

  function say(text) { if (sub) sub.textContent = text; }
  function ls(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ } }
  function isLocalOrigin(origin) { return /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(origin || ""); }

  /** 带超时的 fetch。⛔ 没有超时的探测 = 永久卡死，这正是上一版卡在首屏的原因。 */
  function fetchWithTimeout(url, options, ms) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, ms);
    var opts = { cache: "no-store" };
    if (options) for (var k in options) opts[k] = options[k];
    if (controller) opts.signal = controller.signal;
    return fetch(url, opts).then(
      function (response) { clearTimeout(timer); return response; },
      function (error) { clearTimeout(timer); throw error; }
    );
  }

  /* ── ① 找本地伴生服务 ────────────────────────────────────────────────────
     同源进来（本机入口）直接用自己；从云端进来才需要探测 127.0.0.1。
     探测顺序：同源 → 上次成功过的 → 默认端口（http 与 localhost 两种写法）。 */
  function agentCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (isLocalOrigin(location.origin)) push(location.origin);
    push(ls("chc-agent"));
    push("http://127.0.0.1:" + DEFAULT_PORT);
    push("http://localhost:" + DEFAULT_PORT);
    return list;
  }

  function findAgent() {
    var candidates = agentCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve(null);
      var base = candidates[index++];
      return fetchWithTimeout(base + "/api/health", null, AGENT_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (info) { lsSet("chc-agent", base); return { base: base, info: info }; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ②' 登录门（仅 connector 模式）────────────────────────────────────────
     两步：① 账号（站长服务器注册/登录，防滥用）② 个人配对码（绑定这台电脑的助手）。
     配对成功 → 把 token 经 URL **fragment**（#t=…，不进服务器日志）带到本机界面，
     本机外壳收下后立即抹掉。网页到这里就交差了 —— 界面是本机的，不是云端的。 */
  var ACCOUNT_BASE = "/cloud-api";   // 站长服务器上的账号服务（Caddy 反代到 127.0.0.1:8091）

  function accountFetch(path, opts, ms) {
    var headers = { "Content-Type": "application/json" };
    var session = ls("chc-session");
    if (session) headers.Authorization = "Bearer " + session;
    if (opts && opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
    return fetchWithTimeout(ACCOUNT_BASE + path, {
      method: (opts && opts.method) || "GET",
      headers: headers,
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
    }, ms || AGENT_PROBE_MS * 2).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    });
  }

  function stepBar(current) {
    var bar = document.createElement("div");
    bar.className = "steps";
    var one = document.createElement("span"); one.className = "st" + (current === 1 ? " on" : ""); one.textContent = "① 账号";
    var two = document.createElement("span"); two.className = "st" + (current === 2 ? " on" : ""); two.textContent = "② 连接电脑";
    bar.appendChild(one); bar.appendChild(two);
    return bar;
  }

  function renderAccount(agentBase, presetPair) {
    boot.hidden = true; gate.hidden = true; login.hidden = false;
    login.innerHTML = "";
    login.appendChild(stepBar(1));

    var brand = document.createElement("div"); brand.className = "brand";
    brand.appendChild(document.createTextNode("Codex Harness"));
    var em = document.createElement("em"); em.textContent = "Cloud"; brand.appendChild(em);

    var mode = { v: "login" };   // login | register
    var userInput = document.createElement("input");
    userInput.className = "code"; userInput.id = "acct-user";
    userInput.placeholder = "用户名（3~24 位字母数字）"; userInput.autocomplete = "username"; userInput.maxLength = 24;
    userInput.style.letterSpacing = "0"; userInput.style.fontSize = "13.5px"; userInput.style.fontFamily = "inherit";
    var passInput = document.createElement("input");
    passInput.className = "code"; passInput.id = "acct-pass"; passInput.type = "password";
    passInput.placeholder = "密码（至少 8 位）"; passInput.autocomplete = "current-password";
    passInput.style.letterSpacing = "0"; passInput.style.fontSize = "13.5px";

    var status = document.createElement("p"); status.className = "status";
    var go = document.createElement("button");
    go.className = "go"; go.textContent = "登录";
    var alt = document.createElement("p"); alt.className = "alt";

    function renderMode() {
      go.textContent = mode.v === "login" ? "登录" : "注册新账号";
      alt.innerHTML = "";
      var link = document.createElement("a");
      link.textContent = mode.v === "login" ? "没有账号？注册一个" : "已有账号？去登录";
      link.onclick = function () { mode.v = mode.v === "login" ? "register" : "login"; status.textContent = ""; renderMode(); };
      alt.appendChild(link);
      passInput.setAttribute("autocomplete", mode.v === "login" ? "current-password" : "new-password");
    }
    function submit() {
      var username = (userInput.value || "").trim();
      var password = passInput.value || "";
      if (!username || !password) { status.textContent = "请填用户名和密码"; status.className = "status warn"; return; }
      go.disabled = true; status.textContent = mode.v === "login" ? "正在登录…" : "正在注册…"; status.className = "status";
      accountFetch(mode.v === "login" ? "/login" : "/register", { method: "POST", body: { username: username, password: password } })
        .then(function (res) {
          if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
            status.textContent = (res.j && res.j.error) || "失败（" + res.status + "）";
            status.className = "status bad"; go.disabled = false;
            return;
          }
          lsSet("chc-session", res.j.token);
          if (res.j.account && res.j.account.role === "admin") lsSet("chc-role", "admin"); else try { localStorage.removeItem("chc-role"); } catch (e) { /* 忽略 */ }
          status.textContent = "登录成功";
          afterAccount(presetPair);
        })
        .catch(function (error) {
          status.textContent = "账号服务不可达（" + (error && error.message ? error.message : "网络") + "）";
          status.className = "status bad"; go.disabled = false;
        });
    }
    go.onclick = submit;
    userInput.addEventListener("keydown", function (e) { if (e.key === "Enter") passInput.focus(); });
    passInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

    login.appendChild(brand);
    var desc = document.createElement("p"); desc.className = "desc";
    desc.textContent = "登录你的账号。数据与执行都在各自电脑上，账号只用于访问管理与防滥用。";
    login.appendChild(desc);
    login.appendChild(userInput);
    login.appendChild(document.createElement("br"));
    login.appendChild(passInput);
    login.appendChild(go);
    login.appendChild(status);
    login.appendChild(alt);
    renderMode();
    userInput.focus();
  }

  function renderPairing(agentBase, presetPair) {
    boot.hidden = true; gate.hidden = true; login.hidden = false;
    login.innerHTML = "";
    login.appendChild(stepBar(2));
    // 已登录身份 + 退出
    var who = ls("chc-session");
    if (who) {
      accountFetch("/me").then(function (res) {
        if (!res.ok) return;
        var acct = document.createElement("p"); acct.className = "acct";
        acct.appendChild(document.createTextNode("当前账号："));
        var b = document.createElement("b"); b.textContent = res.j.account.username;
        acct.appendChild(b);
        if (res.j.account.role === "admin") {
          var adminLink = document.createElement("a"); adminLink.textContent = "（用户管理）";
          adminLink.style.marginLeft = "6px"; adminLink.style.cursor = "pointer"; adminLink.style.textDecoration = "underline";
          adminLink.onclick = function () { window.open("admin.html", "_blank"); };
          acct.appendChild(adminLink);
        }
        login.appendChild(acct);
        var out = document.createElement("p"); out.className = "out";
        var outLink = document.createElement("a"); outLink.textContent = "退出登录";
        outLink.onclick = function () {
          accountFetch("/logout", { method: "POST" }).catch(function () { /* 忽略 */ });
          try { localStorage.removeItem("chc-session"); } catch (e) { /* 忽略 */ }
          renderAccount(agentBase);
        };
        out.appendChild(outLink); login.appendChild(out);
      }).catch(function () { /* 身份拿不到也不挡配对 */ });
    }

    var label = document.createElement("label");
    label.textContent = "个人配对码"; label.setAttribute("for", "login-code");
    var input = document.createElement("input");
    input.className = "code"; input.id = "login-code";
    input.placeholder = "8 位十六进制"; input.maxLength = 8;
    input.autocomplete = "off"; input.spellcheck = false;
    if (presetPair) input.value = String(presetPair).toLowerCase();
    var status = document.createElement("p"); status.className = "status";
    var go = document.createElement("button");
    go.className = "go"; go.textContent = "连接我的电脑";
    go.onclick = function () {
      var code = (input.value || "").trim().toLowerCase();
      if (!code) { status.textContent = "请填入个人配对码"; status.className = "status warn"; input.focus(); return; }
      go.disabled = true; input.disabled = true;
      status.textContent = "正在连接…"; status.className = "status";
      fetchWithTimeout(agentBase + "/api/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-harness-client": "web" },
        body: JSON.stringify({ code: code }),
      }, AGENT_PROBE_MS * 2).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
            var reason = res.j && res.j.error;
            var text = reason === "mismatch" ? "配对码不对，请核对后重试"
              : reason === "locked" ? "尝试次数过多，已临时锁定 —— 约 1 分钟后再试"
              : reason === "expired" ? "配对码已过期" : "连接失败（" + (reason || "未知") + "）";
            status.textContent = text; status.className = "status bad";
            go.disabled = false; input.disabled = false; input.select();
            return;
          }
          status.textContent = "已连接，正在进入界面…";
          window.location.href = agentBase + "/#t=" + encodeURIComponent(res.j.token);
        })
        .catch(function (error) {
          status.textContent = "本机服务不可达（" + (error && error.message ? error.message : "网络") + "）";
          status.className = "status bad";
          go.disabled = false; input.disabled = false;
        });
    };
    input.addEventListener("keydown", function (event) { if (event.key === "Enter") go.click(); });

    var why = document.createElement("p");
    why.className = "why";
    why.innerHTML = "配对码在哪？三句话说明白：<br>" +
      "① 这是<b>你自己的电脑</b>：在桌面助手的命令行执行 <b>--add-user 你的名字</b>，它会打出 8 位配对码（每人一个，长期有效）；<br>" +
      "② 这是<b>别人的电脑</b>：让机主执行上面命令，把打出来的码发给你；<br>" +
      "③ 填进上面输入框点「连接我的电脑」——本机会记住这台设备，下次直接进，不再输码。";
    var guideToggle = document.createElement("a");
    guideToggle.textContent = " ▸ 展开说明";
    guideToggle.style.cssText = "cursor:pointer;color:inherit;text-decoration:underline;font-size:12px";
    guideToggle.onclick = function () {
      var open = why.style.display !== "none";
      why.style.display = open ? "none" : "";
      guideToggle.textContent = open ? " ▸ 展开说明" : " ▾ 收起说明";
    };
    why.style.display = "none";
    login.appendChild(label);
    login.appendChild(input);
    login.appendChild(go);
    login.appendChild(status);
    login.appendChild(guideToggle);
    login.appendChild(why);
    input.focus();
  }

  /** connector 模式的主流程。
     ⛔ 账号步**永远在最前**：注册/登录是"网站的身份"，跟本机助手开没开没关系 ——
     上一版先找助手、找不到就直接进旧版提示卡，用户连注册入口都看不到（真实投诉）。
     顺序：账号（有会话就跳过）→ 找本机助手 → 配对。 */
  function runConnector() {
    var preset = new URLSearchParams(location.search).get("pair");
    accountFetch("/me").then(function (res) {
      if (res.ok && res.j && res.j.ok) afterAccount(preset);
      else renderAccount(preset);
    }).catch(function () { renderAccount(preset); });
  }

  /** 账号就绪后：找本机助手 → 配对步；找不到就给"启动指引"（可重试）。 */
  function afterAccount(preset) {
    say("正在寻找本机助手…");
    boot.hidden = false; login.hidden = true;
    findAgent().then(function (agent) {
      if (!agent) { showAssistantGate(); return; }
      renderPairing(agent.base, preset);
    }).catch(function (error) {
      showGate("连接失败", String(error && error.message ? error.message : error), null);
    });
  }

  /* ── ② 选资产基址 ────────────────────────────────────────────────────────
     能开出 version.json 的就是活的。顺序：服务端指定的云端 → 自己所在目录 → 本地副本。 */
  function assetCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (window.__CHC_CDN__) push(window.__CHC_CDN__);
    if (!isLocalOrigin(location.origin)) push(location.origin + location.pathname.replace(/[^/]*$/, "").replace(/\/+$/, ""));
    push("/local-assets");
    return list;
  }

  function findAssetBase() {
    var candidates = assetCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve("");
      var base = candidates[index++];
      return fetchWithTimeout(base + "/version.json?t=" + Date.now(), null, ASSET_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function () { return base; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ③ 插资产 ─────────────────────────────────────────────────────────── */
  function mount(assetBase, agentBase) {
    if (started) return;
    started = true;
    window.__CHC_ASSET_BASE__ = assetBase;
    window.__CHC_AGENT__ = agentBase;
    window.__CHC_SHELL__ = {
      protocolVersion: 1,
      agentVersion: "0.1.0",
      cdnBase: assetBase,
      agentBase: agentBase,
    };

    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = assetBase + "/styles.css?v=" + V;
    document.head.appendChild(link);

    var script = document.createElement("script");
    script.type = "module";
    script.src = assetBase + "/app.js?v=" + V;
    script.onerror = function () {
      gate.hidden = true;
      boot.hidden = false;
      say("");
      showGate("界面资源加载失败", "资产地址：" + assetBase + " —— 本地副本也读不到。", null);
    };
    document.head.appendChild(script);

    // ⛔ 就绪超时：没有它，资源"既没成功也没报错"时页面就永远停在首屏（上一版的实际症状）。
    setTimeout(function () {
      if (window.__chcReady) return;
      boot.hidden = true;
      showGate(
        "界面没有渲染出来",
        "资源地址 " + assetBase + " 已连通，但界面脚本没有完成初始化。刷新一次通常就好；若反复出现请把这条消息截图反馈。",
        function (box) { replay(box); }
      );
    }, READY_TIMEOUT_MS);
  }

  /* ── ④ 出错时给人看得懂的话，而不是一直转 ─────────────────────────────── */
  function showGate(title, detail, extra) {
    boot.hidden = true;
    gate.hidden = false;
    gate.innerHTML = "";

    var h1 = document.createElement("h1");
    h1.textContent = title;
    var p = document.createElement("p");
    p.textContent = detail;
    gate.appendChild(h1);
    gate.appendChild(p);

    var row = document.createElement("div");
    row.className = "row";
    var retryBtn = document.createElement("button");
    retryBtn.textContent = "重新检测";
    retryBtn.onclick = function () { replay(gate); };
    row.appendChild(retryBtn);
    var dl = document.createElement("button");
    dl.textContent = "去下载桌面助手";
    dl.onclick = function () { window.open("https://dl.ppz123.asia", "_blank"); };
    row.appendChild(dl);
    gate.appendChild(row);

    var why = document.createElement("p");
    why.className = "why";
    why.textContent = "排查：桌面助手只监听本机 127.0.0.1，必须在这台电脑上启动；" +
      "若浏览器装了拦截本地请求的扩展，请放行。";
    gate.appendChild(why);
  }

  /** 本机助手没在运行的引导（终用户版：没有人该看到 npm 命令）。 */
  function showAssistantGate() {
    showGate(
      "先启动这台电脑上的助手",
      "你的账号已就绪。干活的助手跑在这台电脑上 —— 现在没有检测到它。\n" +
      "已安装过：双击桌面上的「Codex Harness Cloud」图标启动，然后点下面的重新检测。\n" +
      "还没安装：点「去下载桌面助手」。",
      null
    );
  }

  /** 重跑一遍（"重新检测"按钮与超时兜底共用）。⛔ 分流：
      connector 的重试回账号/配对流程 —— 走 probeAndMount 会把完整界面绕过登录门直接挂上。 */
  function replay(box) {
    started = false;
    box.hidden = true;
    boot.hidden = false;
    if (MODE === "connector") {
      say("正在寻找本机助手…");
      accountFetch("/me").then(function (res) {
        if (res.ok && res.j && res.j.ok) afterAccount(null);
        else renderAccount(null);
      }).catch(function () { renderAccount(null); });
      return;
    }
    say("正在连接本地伴生服务…");
    probeAndMount();
  }

  function probeAndMount() {
    say("正在寻找本地伴生服务…");
    findAgent().then(function (agent) {
      if (!agent) {
        showGate(
          "没找到本地伴生服务",
          "界面在云端，干活的身子在你电脑上 —— 现在这台电脑上没有检测到它。请先在「这台电脑」上启动它：",
          null
        );
        return;
      }
      say("已连接本机伴生服务，正在载入界面…");
      return findAssetBase().then(function (base) {
        if (!base) {
          showGate("界面资源拿不到", "云端与本地副本都没能读到 version.json，请检查网络后重试。", null);
          return;
        }
        mount(base, agent.base);
      });
    }).catch(function (error) {
      showGate("连接失败", String(error && error.message ? error.message : error), null);
    });
  }

  window.__chcHideBoot = function () { boot.hidden = true; };
  window.__chcRetry = function () { replay(gate); };

  if (MODE === "connector") runConnector();
  else probeAndMount();
})();
</script>
</body>
