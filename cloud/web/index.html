<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Codex Assistant · 账号与设备</title>
<!--
  这个外壳**同一份文件在三个地方都能用**，靠运行时判断，不靠服务端替换占位符：
    ① 云端：https://ppz123.asia/cloud/          ← 用户直接敲网址进来的入口
    ② 本机：http://127.0.0.1:8917/              ← 伴生服务下发（同源，最省事）
    ③ 离线：伴生服务在云端资产拿不到时给你本地副本

  ⛔⛔ 之前这文件里写着 `__CDN_BASE__` / `__PROTOCOL_VERSION__` 之类的占位符，**只有本地服务端会替换**，
     云端原样下发就出事了：`fetch("__CDN_BASE__/version.json")` 必然失败 → 回落 `/local-assets`（云端 404）
     → 界面永远停在"正在连接本地伴生服务…"，而且**首屏没有超时**，就那样一直转。
     教训：能被云端原样托管的文件，**必须自己就能跑**，不许依赖只有某一侧才会做的替换。
     服务端现在改为**注入** `window.__CHC_CDN__`（可选覆盖），文件里不再有占位符。

  ⛔ 跨源两件事，缺一不可（云端页面要连本机 127.0.0.1）：
     ① 伴生服务要回 CORS 头（Origin 白名单里要有 https://ppz123.asia）；
     ② 要承诺 `Access-Control-Allow-Private-Network: true`（Chrome 的私有网络访问预检）。
-->
<style>
  /* ── 门页设计令牌（自包含；与桌面版令牌同源，另加品牌紫）──────────────────
     ⛔ 外壳自带的首屏样式：资产到达前不能白屏，也不能跳版（index.html 必须自足可跑）。 */
  :root {
    --g-bg: #141413;
    --g-card: #1e1e1d;
    --g-field: #ffffff0a;
    --g-line: #ffffff17;
    --g-line-soft: #ffffff0f;
    --g-text: #ececea;
    --g-muted: #a6a6a1;
    --g-faint: #7c7c76;
    --g-brand-1: #a78bfa;
    --g-brand-2: #7c3aed;
    --g-brand-ink: #c4b5fd;
    --g-ok: #58c085;
    --g-warn: #f0a35c;
    --g-bad: #ec7a70;
    --g-dur: 180ms;
  }
  html[data-theme="light"] {
    --g-bg: #f4f4f3;
    --g-card: #ffffff;
    --g-field: #00000006;
    --g-line: #00000017;
    --g-line-soft: #0000000d;
    --g-text: #23231f;
    --g-muted: #6f6f69;
    --g-faint: #8b8b85;
    --g-brand-1: #8b5cf6;
    --g-brand-2: #6d28d9;
    --g-brand-ink: #6d28d9;
  }

  html, body { margin: 0; height: 100%; background: var(--g-bg); color: var(--g-text); }
  html[data-theme="light"], html[data-theme="light"] body { background: var(--g-bg); color: var(--g-text); }
  body {
    font: 14px/1.6 Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizelegibility;
    /* 品牌时刻：顶部的紫晕只用一档，面积克制（规范 §1.1：强调色面积 ≤10%） */
    background-image: radial-gradient(720px 420px at 50% -12%, color-mix(in srgb, var(--g-brand-2) 26%, transparent), transparent 68%);
    background-repeat: no-repeat;
  }
  #boot { padding: 32px; color: var(--g-muted); }
  #boot[hidden] { display: none; }
  #boot .mark { font-weight: 600; letter-spacing: .01em; color: var(--g-text); }
  #boot .sub { margin-top: 6px; font-size: 12.5px; opacity: .72; }
  #boot[hidden] { display: none; }

  button, input { appearance: none; -webkit-appearance: none; font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--g-brand-1); outline-offset: 2px; border-radius: 8px; }

  /* ── 卡片（登录门 / 启动指引共用容器）────────────────────────────────────── */
  #gate, #login {
    max-width: 400px;
    margin: 8vh auto 0;
    padding: 30px 30px 26px;
    border-radius: var(--g-radius);
    border: 1px solid var(--g-line);
    background: var(--g-card);
    box-shadow: 0 1px 2px #00000026, 0 18px 48px #00000059;
    animation: gate-in 220ms cubic-bezier(.2,.8,.2,1);
  }
  #gate { max-width: 640px; margin-top: 10vh; }
  @keyframes gate-in {
    from { opacity: 0; transform: translateY(10px) scale(.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #gate, #login { animation: none; }
  }

  /* 品牌头：紫渐变方块 + 渐变字（与桌面版 --brand-ink 同源） */
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--g-brand-1), var(--g-brand-2) 55%, #3b1d8f);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--g-brand-2) 45%, transparent);
  }
  .brand-name {
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
    background: linear-gradient(100deg, var(--g-brand-1), var(--g-brand-ink), var(--g-brand-1));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .brand-name em { font-style: normal; -webkit-text-fill-color: var(--g-faint); color: var(--g-faint); font-weight: 400; margin-left: 6px; font-size: 12px; }

  /* 步骤指示：当前项有非颜色标识（实心点 + 字重） */
  .steps { display: flex; gap: 6px; margin-bottom: 16px; font-size: 11.5px; }
  .steps .st {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--g-line); color: var(--g-faint);
  }
  .steps .st.on {
    border-color: color-mix(in srgb, var(--g-brand-2) 60%, transparent);
    color: var(--g-brand-ink);
    background: color-mix(in srgb, var(--g-brand-2) 12%, transparent);
    font-weight: 500;
  }
  .steps .st.done { color: var(--g-muted); border-color: var(--g-line); }
  .steps .st.done::before { content: "✓"; font-size: 10px; }

  /* 说明与标题 */
  #gate h1, .card-title { font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0 0 6px; }
  #gate p, .card-desc { font-size: 13px; line-height: 1.7; color: var(--g-muted); margin: 0 0 14px; }
  #gate code {
    font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    background: var(--g-field); border: 1px solid var(--g-line); border-radius: 6px; padding: 1px 5px;
  }
  #gate pre {
    font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    background: var(--g-field); border: 1px solid var(--g-line); border-radius: 8px;
    padding: 10px 12px; overflow: auto; margin: 0 0 14px;
  }
  #gate .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

  /* ── 表单：label 可见 · 40px 高 · 焦点紫环 ────────────────────────────────── */
  #login label, #gate label {
    display: block; font-size: 12px; color: var(--g-muted);
    margin: 0 0 6px; font-weight: 500;
  }
  #login input, #gate input {
    width: 100%; min-height: 40px; padding: 9px 12px;
    border-radius: 10px; border: 1px solid var(--g-line);
    background: var(--g-field); color: var(--g-text);
    font-size: 14px; transition: border-color var(--g-dur) ease, box-shadow var(--g-dur) ease;
  }
  #login input::placeholder, #gate input::placeholder { color: var(--g-faint); }
  #login input:focus, #gate input:focus {
    outline: 0; border-color: var(--g-brand-2);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--g-brand-2) 25%, transparent);
  }
  #login input.code {
    font-family: ui-monospace, Consolas, monospace;
    letter-spacing: .22em; font-size: 17px; text-align: center; text-transform: lowercase;
  }

  /* ── 按钮：主（品牌紫渐变）/ 幽灵 / 危险；同组同高 40px ───────────────────── */
  #login .go, #gate button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; min-height: 40px; padding: 9px 14px;
    border-radius: 10px; border: 0; cursor: pointer;
    font-size: 13.5px; font-weight: 600; letter-spacing: .02em;
    transition: filter var(--g-dur) ease, transform var(--g-dur) ease;
  }
  #login .go { margin-top: 12px; background: linear-gradient(135deg, var(--g-brand-1), var(--g-brand-2)); color: #fff; }
  #login .go:hover:not(:disabled) { filter: brightness(1.08); }
  #login .go:active:not(:disabled) { transform: translateY(1px); }
  #login .go:disabled { opacity: .55; cursor: default; filter: none; }
  #login .go.alt {
    background: transparent; border: 1px solid var(--g-line); color: var(--g-text);
    font-weight: 500; margin-top: 10px;
  }
  #login .go.alt:hover:not(:disabled) { background: var(--g-field); }
  #gate button {
    border: 1px solid var(--g-line); background: var(--g-field); color: var(--g-text);
    font-weight: 500; width: auto; min-width: 96px;
  }
  #gate button:hover { background: color-mix(in srgb, var(--g-text) 8%, transparent); }

  .status { font-size: 12.5px; margin: 12px 0 0; min-height: 18px; line-height: 1.6; }
  .status.ok { color: var(--g-ok); }
  .status.warn { color: var(--g-warn); }
  .status.bad { color: var(--g-bad); }

  /* ── 表单域（非等宽：用户名/密码）与行内链接按钮 ─────────────────────────── */
  #login .field { font-family: inherit; letter-spacing: normal; font-size: 14px; text-align: left; }
  .link-soft { margin-left: 8px; cursor: pointer; color: var(--g-brand-ink); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
  .link-danger { margin-left: 8px; cursor: pointer; color: var(--g-bad); text-decoration: underline; text-underline-offset: 3px; font-size: 11.5px; flex: none; }
  .guide-toggle { cursor: pointer; color: var(--g-muted); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
  .guide-toggle:hover { color: var(--g-text); }
  .btn-ic { width: 14px; height: 14px; flex: none; }

  #login .why { font-size: 12px; color: var(--g-faint); margin-top: 14px; line-height: 1.7; }
  #login .alt { margin-top: 12px; font-size: 12.5px; text-align: center; }
  #login .alt a { color: var(--g-brand-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  #login .acct { font-size: 12.5px; color: var(--g-muted); margin: -4px 0 14px; }
  #login .acct b { color: var(--g-text); font-weight: 600; }
  #login .out { font-size: 12px; margin: 10px 0 0; text-align: right; }
  #login .out a { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--g-muted); }
  #login .out a:hover { color: var(--g-text); }

  /* 我的设备（认领后出现在这里） */
  .my-devices { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--g-line-soft); }
  .my-devices .acct { margin-bottom: 8px; }
  .device-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--g-line-soft); background: var(--g-field);
    font-size: 12.5px; margin-bottom: 6px;
  }
  .device-row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .device-row a { color: var(--g-bad); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 11.5px; flex: none; }

  /* 本机配对码（认领用）：大号等宽 + 品牌紫面板 */
  .pair-code-box {
    margin: 14px 0 4px; padding: 14px 12px;
    border-radius: 12px; text-align: center;
    border: 1px solid color-mix(in srgb, var(--g-brand-2) 45%, transparent);
    background: color-mix(in srgb, var(--g-brand-2) 12%, transparent);
  }
  .pair-code-box .cap { font-size: 11.5px; color: var(--g-muted); margin-bottom: 6px; }
  .pair-code-box .code {
    font: 600 24px/1.2 ui-monospace, Consolas, monospace;
    letter-spacing: .3em; color: var(--g-brand-ink);
    text-indent: .3em;   /* 抵消末字符的字距，视觉居中 */
  }

  /* 启动指引卡（本机没开时） */
  #gate .card-title { margin-bottom: 8px; }
  #gate .why { font-size: 12px; color: var(--g-faint); margin-top: 12px; }
</style>
</head>
<body>
<div id="boot">
  <div class="mark">Codex Assistant</div>
  <div class="sub" id="boot-sub">正在连接本地伴生服务…</div>
</div>

<div id="login" hidden></div>

<div id="gate" hidden></div>

<script>
  // 主题在资产到达前先定下来，避免"先亮后暗"的闪一下
  try {
    var savedTheme = localStorage.getItem("chc-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch (e) { /* 隐私模式下 localStorage 可能抛异常，忽略 */ }
</script>

<script>
(function () {
  "use strict";
  var V = "0.1.0";                       // 资产版本戳，只用于缓存击穿
  var DEFAULT_PORT = 8917;
  var AGENT_PROBE_MS = 1200;             // 单个候选地址的探测超时
  var ASSET_PROBE_MS = 1800;             // 云端资产探测超时
  var READY_TIMEOUT_MS = 8000;           // 资产插进去后多久还没就绪就报错

  var boot = document.getElementById("boot");
  var sub = document.getElementById("boot-sub");
  var gate = document.getElementById("gate");
  var login = document.getElementById("login");
  var started = false;

  /* ── 模式判定 ──────────────────────────────────────────────────────────────
     ⛔ 由服务端注入 __CHC_MODE__（本机下发 = "full"）。云端原样托管拿不到注入
        ⇒ connector：网页**只负责连接本地** —— 渲染登录门，配对成功后把人送到
        本机伴生服务的界面（界面本身由桌面助手提供，网页不装、不仿）。 */
  var MODE = window.__CHC_MODE__ === "full" ? "full" : "connector";

  function say(text) { if (sub) sub.textContent = text; }
  function ls(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ } }
  function isLocalOrigin(origin) { return /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(origin || ""); }

  /** 带超时的 fetch。⛔ 没有超时的探测 = 永久卡死，这正是上一版卡在首屏的原因。 */
  function fetchWithTimeout(url, options, ms) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, ms);
    var opts = { cache: "no-store" };
    if (options) for (var k in options) opts[k] = options[k];
    if (controller) opts.signal = controller.signal;
    return fetch(url, opts).then(
      function (response) { clearTimeout(timer); return response; },
      function (error) { clearTimeout(timer); throw error; }
    );
  }

  /* ── ① 找本地伴生服务 ────────────────────────────────────────────────────
     同源进来（本机入口）直接用自己；从云端进来才需要探测 127.0.0.1。
     探测顺序：同源 → 上次成功过的 → 默认端口（http 与 localhost 两种写法）。 */
  function agentCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (isLocalOrigin(location.origin)) push(location.origin);
    push(ls("chc-agent"));
    push("http://127.0.0.1:" + DEFAULT_PORT);
    push("http://localhost:" + DEFAULT_PORT);
    return list;
  }

  function findAgent() {
    var candidates = agentCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve(null);
      var base = candidates[index++];
      return fetchWithTimeout(base + "/api/health", null, AGENT_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (info) { lsSet("chc-agent", base); return { base: base, info: info }; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ②' 登录门（仅 connector 模式）────────────────────────────────────────
     两步：① 账号（站长服务器注册/登录，防滥用）② 个人配对码（绑定这台电脑的助手）。
     配对成功 → 把 token 经 URL **fragment**（#t=…，不进服务器日志）带到本机界面，
     本机外壳收下后立即抹掉。网页到这里就交差了 —— 界面是本机的，不是云端的。 */
  var ACCOUNT_BASE = "/cloud-api";   // 站长服务器上的账号服务（Caddy 反代到 127.0.0.1:8091）

  function accountFetch(path, opts, ms) {
    var headers = { "Content-Type": "application/json" };
    var session = ls("chc-session");
    if (session) headers.Authorization = "Bearer " + session;
    if (opts && opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
    return fetchWithTimeout(ACCOUNT_BASE + path, {
      method: (opts && opts.method) || "GET",
      headers: headers,
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
    }, ms || AGENT_PROBE_MS * 2).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    });
  }

  function stepBar(current) {
    var bar = document.createElement("div");
    bar.className = "steps";
    var one = document.createElement("span"); one.className = "st" + (current === 1 ? " on" : ""); one.textContent = "① 账号";
    var two = document.createElement("span"); two.className = "st" + (current === 2 ? " on" : ""); two.textContent = "② 连接电脑";
    bar.appendChild(one); bar.appendChild(two);
    return bar;
  }

  /* 按钮内联图标（无图标库依赖；stroke 跟随 currentColor ⇒ 暗色/亮色自适应） */
  var IC = {
    arrow: '<svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
    shield: '<svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>',
    plug: '<svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>'
  };

  function renderAccount(agentBase, presetPair) {
    boot.hidden = true; gate.hidden = true; login.hidden = false;
    login.innerHTML = "";
    login.appendChild(stepBar(1));

    var mode = { v: "login" };   // login | register
    var userInput = document.createElement("input");
    userInput.className = "field"; userInput.id = "acct-user";
    userInput.placeholder = "用户名（3~24 位字母数字）"; userInput.autocomplete = "username"; userInput.maxLength = 24;
    var passInput = document.createElement("input");
    passInput.className = "field"; passInput.id = "acct-pass"; passInput.type = "password";
    passInput.placeholder = "密码（至少 8 位）"; passInput.autocomplete = "current-password";
    /* 邀请码：⛔ 只在**注册**时出现（登录不需要），且与后端同一套归一化（去空白/转小写）。
       它是"注册来源"的唯一抓手 —— 见 docs/CLOUD-INVITE-CODES.md。 */
    var inviteInput = document.createElement("input");
    inviteInput.className = "field"; inviteInput.id = "acct-invite";
    inviteInput.placeholder = "邀请码（8 位，向管理员索取）"; inviteInput.autocomplete = "off";
    inviteInput.maxLength = 12; inviteInput.hidden = true;

    var status = document.createElement("p"); status.className = "status";
    var go = document.createElement("button");
    go.className = "go"; go.innerHTML = IC.arrow + "<span>登录</span>";
    var alt = document.createElement("p"); alt.className = "alt";

    function renderMode() {
      var label = mode.v === "login" ? "登录" : "创建账号";
      go.innerHTML = IC.arrow + "<span>" + label + "</span>";
      alt.innerHTML = "";
      var link = document.createElement("a");
      link.textContent = mode.v === "login" ? "没有账号？注册一个" : "已有账号？去登录";
      link.onclick = function () { mode.v = mode.v === "login" ? "register" : "login"; status.textContent = ""; renderMode(); };
      alt.appendChild(link);
      passInput.setAttribute("autocomplete", mode.v === "login" ? "current-password" : "new-password");
      inviteInput.hidden = mode.v === "login";
      if (mode.v === "login") inviteInput.value = "";
    }
    function submit() {
      var username = (userInput.value || "").trim();
      var password = passInput.value || "";
      var invite = (inviteInput.value || "").trim().toLowerCase();
      if (!username || !password) { status.textContent = "请填用户名和密码"; status.className = "status warn"; return; }
      if (mode.v === "register" && !invite) { status.textContent = "请填邀请码（没有的话找管理员要一个）"; status.className = "status warn"; inviteInput.focus(); return; }
      go.disabled = true; status.textContent = mode.v === "login" ? "正在登录…" : "正在注册…"; status.className = "status";
      accountFetch(mode.v === "login" ? "/login" : "/register", { method: "POST", body: mode.v === "login" ? { username: username, password: password } : { username: username, password: password, invite: invite } })
        .then(function (res) {
          if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
            status.textContent = (res.j && res.j.error) || "失败（" + res.status + "）";
            status.className = "status bad"; go.disabled = false;
            return;
          }
          lsSet("chc-session", res.j.token);
          if (res.j.account && res.j.account.role === "admin") lsSet("chc-role", "admin"); else try { localStorage.removeItem("chc-role"); } catch (e) { /* 忽略 */ }
          status.textContent = "登录成功";
          afterAccount(presetPair);
        })
        .catch(function (error) {
          status.textContent = "账号服务不可达（" + (error && error.message ? error.message : "网络") + "）";
          status.className = "status bad"; go.disabled = false;
        });
    }
    go.onclick = submit;
    userInput.addEventListener("keydown", function (e) { if (e.key === "Enter") passInput.focus(); });
    passInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    inviteInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

    /* 品牌头（10-13 界面重构）：紫渐变方块 + 渐变字（与桌面版品牌同源） */
    var brandRow = document.createElement("div"); brandRow.className = "brand-row";
    var mark = document.createElement("div"); mark.className = "brand-mark";
    var brand = document.createElement("div"); brand.className = "brand-name";
    brand.appendChild(document.createTextNode("Codex Assistant"));
    var em = document.createElement("em"); em.textContent = "Cloud"; brand.appendChild(em);
    brandRow.appendChild(mark); brandRow.appendChild(brand);
    login.appendChild(brandRow);
    var desc = document.createElement("p"); desc.className = "desc";
    desc.textContent = "登录你的账号。数据与执行都在各自电脑上，账号只用于访问管理与防滥用。";
    login.appendChild(desc);
    login.appendChild(userInput);
    login.appendChild(document.createElement("br"));
    login.appendChild(passInput);
    login.appendChild(inviteInput);
    login.appendChild(go);
    login.appendChild(status);
    login.appendChild(alt);
    renderMode();
    userInput.focus();
  }

  function renderPairing(agentBase, presetPair, presetClaim) {
    boot.hidden = true; gate.hidden = true; login.hidden = false;
    login.innerHTML = "";
    login.appendChild(stepBar(2));
    // 已登录身份 + 退出
    var who = ls("chc-session");
    if (who) {
      accountFetch("/me").then(function (res) {
        if (!res.ok) return;
        var acct = document.createElement("p"); acct.className = "acct";
        acct.appendChild(document.createTextNode("当前账号："));
        var b = document.createElement("b"); b.textContent = res.j.account.username;
        acct.appendChild(b);
        var center = document.createElement("a"); center.textContent = "（用户中心）";
        center.className = "link-soft";
        center.onclick = function () { window.location.href = "account.html"; };
        acct.appendChild(center);
        if (res.j.account.role === "admin") {
          var adminLink = document.createElement("a"); adminLink.textContent = "（用户管理）";
          adminLink.className = "link-soft";
          adminLink.onclick = function () { window.open("admin.html", "_blank"); };
          acct.appendChild(adminLink);
        }
        login.appendChild(acct);
        var out = document.createElement("p"); out.className = "out";
        var outLink = document.createElement("a"); outLink.textContent = "退出登录";
        outLink.onclick = function () {
          accountFetch("/logout", { method: "POST" }).catch(function () { /* 忽略 */ });
          try { localStorage.removeItem("chc-session"); } catch (e) { /* 忽略 */ }
          renderAccount(agentBase);
        };
        out.appendChild(outLink); login.appendChild(out);
        /* 我的设备（10-13 二期）：本机码认领后落在这里，可随时吊销（吊销后那台机器要重新认领） */
        accountFetch("/devices").then(function (res) {
          if (!res.ok || !res.j || !res.j.ok || !res.j.devices || !res.j.devices.length) return;
          var box = document.createElement("div"); box.className = "my-devices";
          var head = document.createElement("p"); head.className = "acct"; head.textContent = "我的设备：";
          box.appendChild(head);
          res.j.devices.forEach(function (d) {
            var row = document.createElement("div"); row.className = "device-row";
            var nm = document.createElement("span"); nm.textContent = d.name + "（" + new Date(d.claimedAt).toLocaleDateString() + "）";
            var rv = document.createElement("a"); rv.textContent = "吊销";
            rv.className = "link-danger";
            rv.onclick = function () {
              accountFetch("/device/revoke", { method: "POST", body: { id: d.id } }).then(function () { renderPairing(agentBase, presetPair); });
            };
            row.appendChild(nm); row.appendChild(rv); box.appendChild(row);
          });
          login.appendChild(box);
        }).catch(function () { /* 设备列表拿不到也不挡配对 */ });
      }).catch(function () { /* 身份拿不到也不挡配对 */ });
    }

    var label = document.createElement("label");
    label.textContent = "个人配对码"; label.setAttribute("for", "login-code");
    var input = document.createElement("input");
    input.className = "code"; input.id = "login-code";
    input.placeholder = "8 位十六进制"; input.maxLength = 8;
    input.autocomplete = "off"; input.spellcheck = false;
    if (presetClaim) input.value = String(presetClaim).toLowerCase();
    else if (presetPair) input.value = String(presetPair).toLowerCase();
    /* ⛔ 10-14 用户令「这里手动填的地方也把粘贴功能加上」：
       Ctrl+V 在各浏览器/输入法组合下并不总是可靠 ⇒ 显式给一个「粘贴」按钮
       （navigator.clipboard.readText === 用户手势内可用），并把粘贴内容清洗成 8 位小写十六进制
       （用户常整段复制「配对码：12fec9e2」这类文本）。 */
    var pasteBtn = document.createElement("button");
    pasteBtn.type = "button"; pasteBtn.className = "paste"; pasteBtn.textContent = "粘贴";
    pasteBtn.style.cssText = "position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 12px;font-size:13px;border-radius:8px;border:1px solid var(--line,#e0e0dc);background:#fff;cursor:pointer";
    function sanitizeCode(text) {
      var hex = String(text || "").toLowerCase().replace(/[^0-9a-f]/g, "");
      return hex.slice(0, 8);
    }
    pasteBtn.onclick = function () {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (text) {
          var clean = sanitizeCode(text);
          if (!clean) { status.textContent = "剪贴板里没有可用的配对码（需 8 位十六进制）"; status.className = "status warn"; return; }
          input.value = clean; input.focus();
          status.textContent = "已粘贴配对码 " + clean; status.className = "status";
        }).catch(function () {
          status.textContent = "读剪贴板被浏览器拒绝 —— 请点进输入框按 Ctrl+V 粘贴"; status.className = "status warn"; input.focus();
        });
      } else {
        status.textContent = "当前浏览器不支持一键粘贴 —— 请点进输入框按 Ctrl+V"; status.className = "status warn"; input.focus();
      }
    };
    /* 输入/粘贴内容统一清洗：只留小写十六进制、最多 8 位（Ctrl+V 走这里也能保证格式干净） */
    input.addEventListener("input", function () { var v = sanitizeCode(input.value); if (v !== input.value) input.value = v; });
    var inputWrap = document.createElement("div");
    inputWrap.style.cssText = "position:relative";
    inputWrap.appendChild(input); inputWrap.appendChild(pasteBtn);

    var status = document.createElement("p"); status.className = "status";
    var go = document.createElement("button");
    go.className = "go"; go.innerHTML = IC.plug + "<span>连接我的电脑</span>";
    go.onclick = function () {
      var code = (input.value || "").trim().toLowerCase();
      if (!code) { status.textContent = "请填入个人配对码"; status.className = "status warn"; input.focus(); return; }
      go.disabled = true; input.disabled = true;
      status.textContent = "正在获取配对票据…"; status.className = "status";
      /* ⛔⛔ 先取票据再配对（10-13）：**账号是配对的前置条件**。
         票据由账号服务签发、一次性、120 秒有效 —— 本机侧会拿它反向核销，
         核销不过就直接拒（连码都不比）。⛔ 绝不缓存票据：它是一次性的，缓存 = 第二次必然失败。 */
      accountFetch("/pair-ticket", { method: "POST" }).then(function (res) {
        if (!res.ok || !res.j || !res.j.ok || !res.j.ticket) {
          var why = (res.j && res.j.error) || "";
          if (why === "unauthorized") {
            status.textContent = "登录状态已过期，请重新登录账号";
            lsSet("chc-session", "");
            try { localStorage.removeItem("chc-session"); } catch (e) { /* 忽略 */ }
            setTimeout(function () { renderAccount(agentBase, presetPair); }, 1200);
          } else {
            status.textContent = "取配对票据失败（" + (why || "账号服务不可达") + "）";
            status.className = "status bad";
            go.disabled = false; input.disabled = false;
          }
          return null;
        }
        status.textContent = "正在连接…";
        return fetchWithTimeout(agentBase + "/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-harness-client": "web" },
          body: JSON.stringify({ code: code, ticket: res.j.ticket }),
        }, AGENT_PROBE_MS * 2);
      }).then(function (r) {
        if (!r) return null;
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
        .then(function (res) {
          if (!res) return;
          if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
            var reason = res.j && res.j.error;
            var text = reason === "mismatch" ? "配对码不对，请核对后重试"
              : reason === "locked" ? "尝试次数过多，已临时锁定 —— 约 1 分钟后再试"
              : reason === "expired" ? "配对码已过期"
              : reason === "ticket-required" ? "缺少配对票据 —— 请重新登录账号后再试"
              : reason === "ticket-used" ? "配对票据已被使用，请再点一次（会自动换一张新票据）"
              : reason === "ticket-expired" ? "配对票据已过期，请再点一次"
              : reason === "ticket-account-disabled" ? "该账号已被停用或不存在 —— 请联系管理员"
              : reason === "ticket-accounts-unreachable" ? "账号服务暂时不可达，无法配对 —— 请稍后重试"
              : reason === "ticket-rate-limited" ? "请求过于频繁，请稍后重试"
              : reason === "ticket-unknown" ? "配对票据无效 —— 请重新登录账号后再试"
              : "连接失败（" + (reason || "未知") + "）";
            status.textContent = text; status.className = "status bad";
            go.disabled = false; input.disabled = false; input.select();
            return;
          }
          status.textContent = "已连接，正在进入界面…";
          window.location.href = agentBase + "/#t=" + encodeURIComponent(res.j.token);
        })
        .catch(function (error) {
          status.textContent = "本机服务不可达（" + (error && error.message ? error.message : "网络") + "）";
          status.className = "status bad";
          go.disabled = false; input.disabled = false;
        });
    };
    input.addEventListener("keydown", function (event) { if (event.key === "Enter") go.click(); });

    var why = document.createElement("p");
    why.className = "why";
    why.innerHTML = "配对码在哪？三句话说明白：<br>" +
      "① 这是<b>你自己的电脑</b>：本机助手窗口/控制台上写着 8 位配对码（一次性，5 分钟一换）；<br>" +
      "② 把它填进上面输入框：<b>「认领这台电脑」</b>把这台机器绑到你的账号（云端管理 / 自动更新用）；<br>" +
      "③ <b>「连接我的电脑」</b>= 立即进入本机界面。两步都做，本机会记住这台设备，下次直接进。";
    var guideToggle = document.createElement("a");
    guideToggle.textContent = " ▸ 展开说明";
    guideToggle.className = "guide-toggle";
    guideToggle.onclick = function () {
      var open = why.style.display !== "none";
      why.style.display = open ? "none" : "";
      guideToggle.textContent = open ? " ▸ 展开说明" : " ▾ 收起说明";
    };
    why.style.display = "none";
    /* 认领这台电脑（10-13 二期）：把本机码绑定到我的账号 ⇒ 本机轮询拿到设备 token 后
       **自动完成连接**（助手窗口自动进入界面），云端管理 / 自动更新都认这个绑定。 */
    var claim = document.createElement("button");
    claim.className = "go alt"; claim.innerHTML = IC.shield + "<span>认领这台电脑（绑定到我的账号）</span>";
    /* ⛔ 10-14 用户实测「绑定会显示电脑，连接不会显示已绑定」：手动「连接我的电脑」走的是
       **旧的本地配对通道**（只发本机会话令牌，不在服务器建设备记录）⇒ 设备列表 / 已绑定都没有。
       现在两条路**统一到认领（claim）**：服务器建设备记录 ⇒ 本机轮询拿到设备令牌 ⇒ 助手自动进入。
       machineId 从本机 /api/health 取（同机重配对不新增设备行）。 */
    function doClaim(code) {
      if (!code) { status.textContent = "请填入本机配对码"; status.className = "status warn"; input.focus(); return; }
      claim.disabled = true;
      status.textContent = "正在认领…"; status.className = "status";
      /* machineId：授权链接带来（PRESET_MID）或直接问本机 /api/health（手动填码路径）——
         保证"同一台机器只占一条设备记录"。拿不到就留空（服务端按码建记录，兼容）。 */
      var midPromise = PRESET_MID
        ? Promise.resolve(PRESET_MID)
        : fetch(agentBase + "/api/health", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { return (j && j.machineId) || ""; }).catch(function () { return ""; });
      midPromise.then(function (mid) {
      accountFetch("/device/claim", { method: "POST", body: { code: code, name: "我的电脑", machineId: mid } }).then(function (res) {
        if (!res.ok || !res.j || !res.j.ok) {
          var why = (res.j && res.j.error) || "";
          status.textContent = why === "unauthorized" ? "登录状态已过期，请重新登录" : "认领失败（" + (why || "未知") + "）";
          status.className = "status bad"; claim.disabled = false; return;
        }
        status.textContent = "已认领 ✓ 正在回到本机完成连接…";
        status.className = "status";
        /* ⛔ OAuth 式收尾：浏览器 302 回本机回调页（/auth/callback），由本机完成令牌交接 */
        setTimeout(function () { window.location.href = agentBase + "/auth/callback?code=" + encodeURIComponent(code); }, 600);
      }).catch(function () { status.textContent = "网络错误"; status.className = "status bad"; claim.disabled = false; });
      });
    }
    claim.onclick = function () { doClaim((input.value || "").trim().toLowerCase()); };
    /* 「连接我的电脑」= 同一条认领（用户问"有啥区别"—— 现在没有区别了） */
    go.onclick = function () { doClaim((input.value || "").trim().toLowerCase()); };
    login.appendChild(label);
    /* ⛔ 10-14 用户问「连接跟绑定电脑有啥区别吗」：**没有区别** —— 都是"用码把这台机器绑到当前账号"。
       上一轮加确认面板时忘了收起旧的手动路径，同一件事出现两个按钮（用户截图里四连按钮）。
       现在：从授权链接来（有 presetClaim）⇒ **只留确认/换号**（码已知，不需要再填）；
       自己直接进站（无 presetClaim）⇒ 只留手动路径（输入码 + 连接我的电脑）。 */
    var cameFromApp = !!presetClaim;
    if (!cameFromApp) {
      login.appendChild(inputWrap);
      login.appendChild(go);   // 只留一个主按钮；认领按钮不再重复出现
    }
    login.appendChild(status);
    login.appendChild(guideToggle);
    login.appendChild(why);
    input.focus();
    /* ⛔⛔ 10-14 用户实测「断开后到配对界面又自动登录了，我想换绑的机会都没有」：
       从授权链接（?claim=）进来**不再自动提交认领** —— 旧的自动认领会把"重新绑定/换号测试"
       变成不可能（标签页一加载就把本机绑回当前登录的号）。改成**一次确认**：
       当前账号 + [确认绑定这台电脑] + [换个账号登录]。一次点击，但决定权在用户手里。 */
    if (presetClaim) {
      var ask = document.createElement("div");
      ask.className = "status";
      ask.style.cssText = "margin-top:10px";
      ask.innerHTML = "本机助手正在等待认领：配对码 <b>" + String(presetClaim).toLowerCase() + "</b>。<br>把<b>这台电脑</b>绑定到当前账号 —— 或换个账号登录。";
      login.appendChild(ask);
      var okBtn = document.createElement("button");
      okBtn.type = "button"; okBtn.className = "go"; okBtn.textContent = "把本机绑定到当前账号";
      okBtn.onclick = function () { okBtn.disabled = true; claim.click(); };
      login.insertBefore(okBtn, status);
      var swBtn = document.createElement("button");
      swBtn.type = "button"; swBtn.className = "go alt"; swBtn.textContent = "换个账号登录（用另一个账号绑定）";
      swBtn.onclick = function () { window.location.href = "index.html?claim=" + encodeURIComponent(String(presetClaim).toLowerCase()) + "&switch=1"; };
      login.insertBefore(swBtn, status);
    }
  }

  /** connector 模式的主流程。
     ⛔ 账号步**永远在最前**：注册/登录是"网站的身份"，跟本机助手开没开没关系 ——
     上一版先找助手、找不到就直接进旧版提示卡，用户连注册入口都看不到（真实投诉）。
     顺序：账号（有会话就跳过）→ 找本机助手 → 配对。 */
  /* ⛔ 模块级：runConnector 与 renderPairing 是两个函数作用域，认领处理器在后者里。 */
  var PRESET_MID = "";
  function runConnector() {
    var preset = new URLSearchParams(location.search).get("pair");
    var presetClaim = new URLSearchParams(location.search).get("claim");
    /* ⛔ switch=1：换账号 —— 强制走登录/注册表单，忽略当前网页会话（否则自动认领又绑回旧号） */
    var forceSwitch = new URLSearchParams(location.search).get("switch") === "1";
    PRESET_MID = new URLSearchParams(location.search).get("mid") || "";   /* 本机稳定标识（同机重配对不新增设备行） */
    if (forceSwitch) { renderAccount(preset, presetClaim); return; }
    accountFetch("/me").then(function (res) {
      if (res.ok && res.j && res.j.ok) afterAccount(preset, presetClaim);
      else renderAccount(preset, presetClaim);
    }).catch(function () { renderAccount(preset, presetClaim); });
  }

  /** 账号就绪后：**直接进账号页**。
   *  ⛔⛔ 用户 10-16 定稿：「把这个检测直接删了不就好了」「就正常注册界面」
   *    ⇒ 彻底删掉「找本机助手 → 配对步」这段检测。分工改为：
   *      · 未登录 / 未注册 ⇒ renderAccount（就是那个正常的注册 / 登录界面）
   *      · 已登录          ⇒ account.html（改密码 / 积分 / 模型勾选 / 设备 / 知识库，
   *                          配对也在那一页的「配对中心」里做 —— ⛔ 能力没有丢失）
   *    ⛔ 为什么删而不是"加一条出口"：探测本机助手只决定**往哪送**，账号功能一个都不依赖它；
   *      留着它唯一的实际效果就是把已登录用户挡在门外（用户两次实名反馈）。 */
  function afterAccount(preset, presetClaim) {
    void preset; void presetClaim;
    window.location.replace("account.html");
  }

  /* ── ② 选资产基址 ────────────────────────────────────────────────────────
     能开出 version.json 的就是活的。顺序：服务端指定的云端 → 自己所在目录 → 本地副本。 */
  function assetCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (window.__CHC_CDN__) push(window.__CHC_CDN__);
    if (!isLocalOrigin(location.origin)) push(location.origin + location.pathname.replace(/[^/]*$/, "").replace(/\/+$/, ""));
    push("/local-assets");
    return list;
  }

  function findAssetBase() {
    var candidates = assetCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve("");
      var base = candidates[index++];
      return fetchWithTimeout(base + "/version.json?t=" + Date.now(), null, ASSET_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function () { return base; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ③ 插资产 ─────────────────────────────────────────────────────────── */
  function mount(assetBase, agentBase) {
    if (started) return;
    started = true;
    window.__CHC_ASSET_BASE__ = assetBase;
    window.__CHC_AGENT__ = agentBase;
    window.__CHC_SHELL__ = {
      protocolVersion: 1,
      agentVersion: "0.1.0",
      cdnBase: assetBase,
      agentBase: agentBase,
    };

    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = assetBase + "/styles.css?v=" + V;
    document.head.appendChild(link);

    var script = document.createElement("script");
    script.type = "module";
    script.src = assetBase + "/app.js?v=" + V;
    script.onerror = function () {
      gate.hidden = true;
      boot.hidden = false;
      say("");
      showGate("界面资源加载失败", "资产地址：" + assetBase + " —— 本地副本也读不到。", null);
    };
    document.head.appendChild(script);

    // ⛔ 就绪超时：没有它，资源"既没成功也没报错"时页面就永远停在首屏（上一版的实际症状）。
    setTimeout(function () {
      if (window.__chcReady) return;
      boot.hidden = true;
      showGate(
        "界面没有渲染出来",
        "资源地址 " + assetBase + " 已连通，但界面脚本没有完成初始化。刷新一次通常就好；若反复出现请把这条消息截图反馈。",
        function (box) { replay(box); }
      );
    }, READY_TIMEOUT_MS);
  }

  /* ── ④ 出错时给人看得懂的话，而不是一直转 ─────────────────────────────── */
  function showGate(title, detail, extra) {
    boot.hidden = true;
    gate.hidden = false;
    gate.innerHTML = "";

    var h1 = document.createElement("h1");
    h1.textContent = title;
    var p = document.createElement("p");
    p.textContent = detail;
    gate.appendChild(h1);
    gate.appendChild(p);

    var row = document.createElement("div");
    row.className = "row";
    var retryBtn = document.createElement("button");
    retryBtn.textContent = "重新检测";
    retryBtn.onclick = function () { replay(gate); };
    row.appendChild(retryBtn);
    var dl = document.createElement("button");
    dl.textContent = "去下载桌面助手";
    dl.onclick = function () { window.open("https://dl.ppz123.asia", "_blank"); };
    row.appendChild(dl);
    gate.appendChild(row);

    /* ⛔ extra 必须真的调用：此前它**只出现在形参里**，传进来的回调从来没被执行过
       （10-16 发现：连带"界面没有渲染出来"那一处的 replay 重放、以及"不需要助手也能进账户管理"
       的出口，全都静默不显示）。放在按钮行之后、排查说明之前 —— 出口要显眼。 */
    if (typeof extra === "function") extra(gate);

    var why = document.createElement("p");
    why.className = "why";
    why.textContent = "排查：桌面助手只监听本机 127.0.0.1，必须在这台电脑上启动；" +
      "若浏览器装了拦截本地请求的扩展，请放行。";
    gate.appendChild(why);
  }

  /** 「不需要助手」的出口。
   *  ⛔ 为什么必须有：助手没跑时整页会被 showAssistantGate / probeAndMount 拦住，
   *    但**账户管理是纯网页功能**（改密码 / 积分流水 / 模型勾选 / 设备 / 知识库 / 记忆），
   *    它只要账号服务在线即可 —— 不该被"本机助手在不在线"绑架。
   *    用户 10-16 实名反馈：「不打开云助手就访问不了用户中心，这个限制要去了」。 */
  function accountEscape(box) {
    var p = document.createElement("p");
    p.className = "why";
    p.style.marginTop = "12px";
    var a = document.createElement("a");
    a.href = "account.html";
    a.textContent = "先不管助手 —— 直接进入账户管理（改密码 / 积分流水 / 模型勾选 / 设备与知识库）→";
    a.style.cssText = "cursor:pointer;text-decoration:underline;color:inherit";
    p.appendChild(a);
    box.appendChild(p);
  }

  /** 本机助手没在运行的引导（终用户版：没有人该看到 npm 命令）。 */
  function showAssistantGate() {
    showGate(
      "先启动这台电脑上的助手",
      "你的账号已就绪。干活的助手跑在这台电脑上 —— 现在没有检测到它。\n" +
      "已安装过：双击桌面上的「Codex Assistant」图标启动，然后点下面的重新检测。\n" +
      "还没安装：点「去下载桌面助手」。",
      accountEscape
    );
  }

  /** 重跑一遍（"重新检测"按钮与超时兜底共用）。⛔ 分流：
      connector 的重试回账号/配对流程 —— 走 probeAndMount 会把完整界面绕过登录门直接挂上。 */
  function replay(box) {
    started = false;
    box.hidden = true;
    boot.hidden = false;
    if (MODE === "connector") {
      say("正在寻找本机助手…");
      accountFetch("/me").then(function (res) {
        if (res.ok && res.j && res.j.ok) afterAccount(null);
        else renderAccount(null);
      }).catch(function () { renderAccount(null); });
      return;
    }
    say("正在连接本地伴生服务…");
    probeAndMount();
  }

  function probeAndMount() {
    say("正在寻找本地伴生服务…");
    findAgent().then(function (agent) {
      if (!agent) {
        showGate(
          "没找到本地伴生服务",
          "界面在云端，干活的身子在你电脑上 —— 现在这台电脑上没有检测到它。请先在「这台电脑」上启动它：",
          accountEscape
        );
        return;
      }
      say("已连接本机伴生服务，正在载入界面…");
      return findAssetBase().then(function (base) {
        if (!base) {
          showGate("界面资源拿不到", "云端与本地副本都没能读到 version.json，请检查网络后重试。", null);
          return;
        }
        mount(base, agent.base);
      });
    }).catch(function (error) {
      showGate("连接失败", String(error && error.message ? error.message : error), null);
    });
  }

  window.__chcHideBoot = function () { boot.hidden = true; };
  window.__chcRetry = function () { replay(gate); };

  if (MODE === "connector") runConnector();
  else probeAndMount();
})();
</script>
</body>
</html>
