<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Codex Harness Cloud</title>
<!--
  这个外壳**同一份文件在三个地方都能用**，靠运行时判断，不靠服务端替换占位符：
    ① 云端：https://ppz123.asia/cloud/          ← 用户直接敲网址进来的入口
    ② 本机：http://127.0.0.1:8917/              ← 伴生服务下发（同源，最省事）
    ③ 离线：伴生服务在云端资产拿不到时给你本地副本

  ⛔⛔ 之前这文件里写着 `__CDN_BASE__` / `__PROTOCOL_VERSION__` 之类的占位符，**只有本地服务端会替换**，
     云端原样下发就出事了：`fetch("__CDN_BASE__/version.json")` 必然失败 → 回落 `/local-assets`（云端 404）
     → 界面永远停在"正在连接本地伴生服务…"，而且**首屏没有超时**，就那样一直转。
     教训：能被云端原样托管的文件，**必须自己就能跑**，不许依赖只有某一侧才会做的替换。
     服务端现在改为**注入** `window.__CHC_CDN__`（可选覆盖），文件里不再有占位符。

  ⛔ 跨源两件事，缺一不可（云端页面要连本机 127.0.0.1）：
     ① 伴生服务要回 CORS 头（Origin 白名单里要有 https://ppz123.asia）；
     ② 要承诺 `Access-Control-Allow-Private-Network: true`（Chrome 的私有网络访问预检）。
-->
<style>
  /* 外壳自带的首屏样式：资产到达前不能白屏，也不能跳版 */
  html, body { margin: 0; height: 100%; background: #1b1b1a; color: #ececea; }
  html[data-theme="light"], html[data-theme="light"] body { background: #fff; color: #23231f; }
  body { font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #boot { padding: 32px; color: inherit; }
  #boot[hidden] { display: none; }
  #boot .mark { font-weight: 600; letter-spacing: .01em; }
  #boot .sub { margin-top: 6px; font-size: 12.5px; opacity: .72; }
  #gate { max-width: 640px; margin: 48px auto; padding: 26px 28px; border-radius: 14px;
        border: 1px solid #ffffff1f; background: #ffffff0a; }
html[data-theme="light"] #gate { border-color: #00000014; background: #00000005; }
  #gate h1 { font-size: 16px; margin: 0 0 10px; }
  #gate p { font-size: 13px; margin: 0 0 14px; opacity: .85; }
  #gate code, #gate pre {
    font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    background: #ffffff14; border: 1px solid #ffffff1f; border-radius: 8px;
  }
  html[data-theme="light"] #gate code, html[data-theme="light"] #gate pre { background: #00000008; border-color: #00000012; }
  #gate code { padding: 1px 5px; }
  #gate pre { padding: 10px 12px; overflow: auto; }
  #gate .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  #gate button {
    appearance: none; -webkit-appearance: none; font: inherit;
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid #ffffff2e; background: #ffffff12; color: inherit;
  }
  #gate button:hover { background: #ffffff1f; }
  #gate input {
    appearance: none; -webkit-appearance: none; font: inherit;
    padding: 7px 10px; border-radius: 8px; width: 190px;
    border: 1px solid #ffffff2e; background: #ffffff0f; color: inherit;
  }
  #gate .why { font-size: 12px; opacity: .6; margin-top: 12px; }

  /* ── 登录门（connector 模式：网页只负责连接本地，界面由本机提供）──────────── */
  #login {
    max-width: 400px; margin: 9vh auto 0; padding: 28px 28px 22px;
    border-radius: 14px; border: 1px solid #ffffff1f; background: #ffffff0a;
  }
  html[data-theme="light"] #login { border-color: #00000014; background: #00000005; }
  #login .brand { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  #login .brand em { font-style: normal; font-weight: 400; font-size: 12px; opacity: .6; margin-left: 6px; }
  #login .desc { font-size: 12.5px; opacity: .75; margin: 0 0 16px; line-height: 1.7; }
  #login label { display: block; font-size: 12px; opacity: .8; margin-bottom: 6px; }
  #login .code {
    appearance: none; -webkit-appearance: none; font: inherit;
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #ffffff2e; background: #ffffff0f; color: inherit;
    font-family: ui-monospace, Consolas, monospace; letter-spacing: .12em; font-size: 15px;
  }
  html[data-theme="light"] #login .code { border-color: #0000002e; background: #00000008; }
  #login .code:focus { outline: 0; border-color: #2f6bdd; }
  html[data-theme="light"] #login .code:focus { border-color: #2f6bdd; }
  #login .go {
    appearance: none; -webkit-appearance: none; font: inherit;
    width: 100%; margin-top: 12px; padding: 9px 0; border-radius: 8px; cursor: pointer;
    border: 0; background: #1a7f37; color: #fff; font-weight: 600; font-size: 13.5px;
  }
  html[data-theme="light"] #login .go { background: #1a7f37; color: #fff; }
  #login .go:hover { filter: brightness(1.08); }
  #login .go:disabled { opacity: .55; cursor: default; }
  #login .status { font-size: 12px; margin: 10px 0 0; min-height: 18px; }
  #login .status.warn { color: #f0a35c; }
  #login .status.bad { color: #ec7a70; }
  #login .why { font-size: 11.5px; opacity: .55; margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div id="boot">
  <div class="mark">Codex Harness Cloud</div>
  <div class="sub" id="boot-sub">正在连接本地伴生服务…</div>
</div>

<div id="login" hidden></div>

<div id="gate" hidden></div>

<script>
  // 主题在资产到达前先定下来，避免"先亮后暗"的闪一下
  try {
    var savedTheme = localStorage.getItem("chc-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch (e) { /* 隐私模式下 localStorage 可能抛异常，忽略 */ }
</script>

<script>
(function () {
  "use strict";
  var V = "0.1.0";                       // 资产版本戳，只用于缓存击穿
  var DEFAULT_PORT = 8917;
  var AGENT_PROBE_MS = 1200;             // 单个候选地址的探测超时
  var ASSET_PROBE_MS = 1800;             // 云端资产探测超时
  var READY_TIMEOUT_MS = 8000;           // 资产插进去后多久还没就绪就报错

  var boot = document.getElementById("boot");
  var sub = document.getElementById("boot-sub");
  var gate = document.getElementById("gate");
  var login = document.getElementById("login");
  var started = false;

  /* ── 模式判定 ──────────────────────────────────────────────────────────────
     ⛔ 由服务端注入 __CHC_MODE__（本机下发 = "full"）。云端原样托管拿不到注入
        ⇒ connector：网页**只负责连接本地** —— 渲染登录门，配对成功后把人送到
        本机伴生服务的界面（界面本身由桌面助手提供，网页不装、不仿）。 */
  var MODE = window.__CHC_MODE__ === "full" ? "full" : "connector";

  function say(text) { if (sub) sub.textContent = text; }
  function ls(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ } }
  function isLocalOrigin(origin) { return /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(origin || ""); }

  /** 带超时的 fetch。⛔ 没有超时的探测 = 永久卡死，这正是上一版卡在首屏的原因。 */
  function fetchWithTimeout(url, options, ms) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, ms);
    var opts = { cache: "no-store" };
    if (options) for (var k in options) opts[k] = options[k];
    if (controller) opts.signal = controller.signal;
    return fetch(url, opts).then(
      function (response) { clearTimeout(timer); return response; },
      function (error) { clearTimeout(timer); throw error; }
    );
  }

  /* ── ① 找本地伴生服务 ────────────────────────────────────────────────────
     同源进来（本机入口）直接用自己；从云端进来才需要探测 127.0.0.1。
     探测顺序：同源 → 上次成功过的 → 默认端口（http 与 localhost 两种写法）。 */
  function agentCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (isLocalOrigin(location.origin)) push(location.origin);
    push(ls("chc-agent"));
    push("http://127.0.0.1:" + DEFAULT_PORT);
    push("http://localhost:" + DEFAULT_PORT);
    return list;
  }

  function findAgent() {
    var candidates = agentCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve(null);
      var base = candidates[index++];
      return fetchWithTimeout(base + "/api/health", null, AGENT_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (info) { lsSet("chc-agent", base); return { base: base, info: info }; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ②' 登录门（仅 connector 模式）────────────────────────────────────────
     个人配对码：由机主 `--add-user 名字` 签发，一人一个、长期有效。
     配对成功 → 把 token 经 URL **fragment**（#t=…，不进服务器日志）带到本机界面，
     本机外壳收下后立即抹掉。网页到这里就交差了 —— 界面是本机的，不是云端的。 */
  function renderLogin(agentBase) {
    boot.hidden = true;
    gate.hidden = true;
    login.hidden = false;
    login.innerHTML = "";

    var brand = document.createElement("div");
    brand.className = "brand";
    brand.appendChild(document.createTextNode("Codex Harness"));
    var em = document.createElement("em"); em.textContent = "Cloud";
    brand.appendChild(em);

    var desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = "登录到这台电脑上的助手。干活的界面由你本机的 Codex Harness 桌面助手提供 —— 网页只负责安全地连上它。";

    var label = document.createElement("label");
    label.textContent = "个人配对码";
    label.setAttribute("for", "login-code");

    var input = document.createElement("input");
    input.className = "code"; input.id = "login-code";
    input.placeholder = "8 位十六进制"; input.maxLength = 8;
    input.autocomplete = "off"; input.spellcheck = false;
    input.setAttribute("aria-label", "个人配对码");

    var status = document.createElement("p");
    status.className = "status";

    var go = document.createElement("button");
    go.className = "go"; go.textContent = "连接我的电脑";
    go.onclick = function () {
      var code = (input.value || "").trim().toLowerCase();
      if (!code) { status.textContent = "请填入个人配对码"; status.className = "status warn"; input.focus(); return; }
      go.disabled = true; input.disabled = true;
      status.textContent = "正在连接…"; status.className = "status";
      fetchWithTimeout(agentBase + "/api/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-harness-client": "web" },
        body: JSON.stringify({ code: code }),
      }, AGENT_PROBE_MS * 2).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
            var reason = res.j && res.j.error;
            var text = reason === "mismatch" ? "配对码不对，请核对后重试"
              : reason === "locked" ? "尝试次数过多，已临时锁定 —— 约 1 分钟后再试"
              : reason === "expired" ? "配对码已过期" : "连接失败（" + (reason || "未知") + "）";
            status.textContent = text; status.className = "status bad";
            go.disabled = false; input.disabled = false; input.select();
            return;
          }
          status.textContent = "已连接，正在进入界面…";
          // token 走 #fragment：不进服务器日志；本机外壳收下后立刻抹掉
          window.location.href = agentBase + "/#t=" + encodeURIComponent(res.j.token);
        })
        .catch(function (error) {
          status.textContent = "本机服务不可达（" + (error && error.message ? error.message : "网络") + "）";
          status.className = "status bad";
          go.disabled = false; input.disabled = false;
        });
    };
    input.addEventListener("keydown", function (event) { if (event.key === "Enter") go.click(); });

    var why = document.createElement("p");
    why.className = "why";
    why.textContent = "没有个人配对码？找这台电脑的主人签发一个（助手控制台：--add-user 你的名字）。" +
      "登录后本机会记住这台设备，下次从本机界面直接进。";

    login.appendChild(brand);
    login.appendChild(desc);
    login.appendChild(label);
    login.appendChild(input);
    login.appendChild(go);
    login.appendChild(status);
    login.appendChild(why);
    input.focus();
  }

  /** connector 模式的主流程：找到本机服务 → 登录门（不再载入云端界面）。 */
  function runConnector() {
    say("正在寻找本机助手…");
    findAgent().then(function (agent) {
      if (!agent) {
        showGate(
          "没找到本机助手",
          "干活的助手跑在这台电脑上 —— 现在没有检测到它。请在这台电脑上启动 Codex Harness 助手：",
          null
        );
        return;
      }
      // 带 ?pair= 进来（旧链接 / 控制台点开）：自动填入
      var preset = new URLSearchParams(location.search).get("pair");
      renderLogin(agent.base);
      if (preset) {
        var input = document.getElementById("login-code");
        if (input) { input.value = preset.toLowerCase(); input.focus(); }
      }
    }).catch(function (error) {
      showGate("连接失败", String(error && error.message ? error.message : error), null);
    });
  }

  /* ── ② 选资产基址 ────────────────────────────────────────────────────────
     能开出 version.json 的就是活的。顺序：服务端指定的云端 → 自己所在目录 → 本地副本。 */
  function assetCandidates() {
    var list = [];
    var push = function (url) { if (url && list.indexOf(url) < 0) list.push(url.replace(/\/+$/, "")); };
    if (window.__CHC_CDN__) push(window.__CHC_CDN__);
    if (!isLocalOrigin(location.origin)) push(location.origin + location.pathname.replace(/[^/]*$/, "").replace(/\/+$/, ""));
    push("/local-assets");
    return list;
  }

  function findAssetBase() {
    var candidates = assetCandidates();
    var index = 0;
    function next() {
      if (index >= candidates.length) return Promise.resolve("");
      var base = candidates[index++];
      return fetchWithTimeout(base + "/version.json?t=" + Date.now(), null, ASSET_PROBE_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function () { return base; })
        .catch(function () { return next(); });
    }
    return next();
  }

  /* ── ③ 插资产 ─────────────────────────────────────────────────────────── */
  function mount(assetBase, agentBase) {
    if (started) return;
    started = true;
    window.__CHC_ASSET_BASE__ = assetBase;
    window.__CHC_AGENT__ = agentBase;
    window.__CHC_SHELL__ = {
      protocolVersion: 1,
      agentVersion: "0.1.0",
      cdnBase: assetBase,
      agentBase: agentBase,
    };

    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = assetBase + "/styles.css?v=" + V;
    document.head.appendChild(link);

    var script = document.createElement("script");
    script.type = "module";
    script.src = assetBase + "/app.js?v=" + V;
    script.onerror = function () {
      gate.hidden = true;
      boot.hidden = false;
      say("");
      showGate("界面资源加载失败", "资产地址：" + assetBase + " —— 本地副本也读不到。", null);
    };
    document.head.appendChild(script);

    // ⛔ 就绪超时：没有它，资源"既没成功也没报错"时页面就永远停在首屏（上一版的实际症状）。
    setTimeout(function () {
      if (window.__chcReady) return;
      boot.hidden = true;
      showGate(
        "界面没有渲染出来",
        "资源地址 " + assetBase + " 已连通，但界面脚本没有完成初始化。刷新一次通常就好；若反复出现请把这条消息截图反馈。",
        function (box) { replay(box); }
      );
    }, READY_TIMEOUT_MS);
  }

  /* ── ④ 出错时给人看得懂的话，而不是一直转 ─────────────────────────────── */
  function showGate(title, detail, extra) {
    boot.hidden = true;
    gate.hidden = false;
    gate.innerHTML = "";

    var h1 = document.createElement("h1");
    h1.textContent = title;
    var p = document.createElement("p");
    p.textContent = detail;
    gate.appendChild(h1);
    gate.appendChild(p);

    var code = document.createElement("pre");
    code.textContent = "cd cloud\nnpm run start        # 真引擎（需要本机有 codex 引擎）\nnpm run start:mock    # 演示模式，不需要模型 key";
    gate.appendChild(code);

    var note = document.createElement("p");
    note.style.margin = "14px 0 0";
    note.textContent = "启动后控制台会打印一条带配对码的链接，点开即完成配对；也可以把配对码填在下面。";
    gate.appendChild(note);

    var row = document.createElement("div");
    row.className = "row";
    var input = document.createElement("input");
    input.placeholder = "配对码（8 位十六进制）";
    input.setAttribute("aria-label", "配对码");
    var pairBtn = document.createElement("button");
    pairBtn.textContent = "配对并进入";
    var retryBtn = document.createElement("button");
    retryBtn.textContent = "重试连接";
    row.appendChild(input);
    row.appendChild(pairBtn);
    row.appendChild(retryBtn);
    gate.appendChild(row);

    var why = document.createElement("p");
    why.className = "why";
    why.textContent = "排查：本机伴生服务只监听 127.0.0.1，所以必须在这台电脑上启动；" +
      "若浏览器装了拦截本地请求的扩展，请放行。";
    gate.appendChild(why);

    pairBtn.onclick = function () {
      var code = (input.value || "").trim().toLowerCase();
      if (!code) { input.focus(); return; }
      location.search = "?pair=" + encodeURIComponent(code);
    };
    retryBtn.onclick = function () { replay(gate); };
    input.addEventListener("keydown", function (event) { if (event.key === "Enter") pairBtn.click(); });
    input.focus();
  }

  /** 重跑一遍选址（"重试连接"按钮与超时兜底共用）。 */
  function replay(box) {
    started = false;
    box.hidden = true;
    boot.hidden = false;
    say("正在连接本地伴生服务…");
    probeAndMount();
  }

  function probeAndMount() {
    say("正在寻找本地伴生服务…");
    findAgent().then(function (agent) {
      if (!agent) {
        showGate(
          "没找到本地伴生服务",
          "界面在云端，干活的身子在你电脑上 —— 现在这台电脑上没有检测到它。请先在「这台电脑」上启动它：",
          null
        );
        return;
      }
      say("已连接本机伴生服务，正在载入界面…");
      return findAssetBase().then(function (base) {
        if (!base) {
          showGate("界面资源拿不到", "云端与本地副本都没能读到 version.json，请检查网络后重试。", null);
          return;
        }
        mount(base, agent.base);
      });
    }).catch(function (error) {
      showGate("连接失败", String(error && error.message ? error.message : error), null);
    });
  }

  window.__chcHideBoot = function () { boot.hidden = true; };
  window.__chcRetry = function () { replay(gate); };

  if (MODE === "connector") runConnector();
  else probeAndMount();
})();
</script>
</body>
</html>
