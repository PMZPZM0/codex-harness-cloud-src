# Codex Harness Assistant · 云版助手打包配置（10-11）
# 与桌面版 electron-builder 配置并列，互不影响：
#   桌面版：electron-builder --win nsis（release.yml，main 入口）
#   云助手：electron-builder --config electron-builder.assistant.yml（release-cloud.yml，headless 入口）
#
# ⛔ 发布形态（用户定稿）：**精简包 + 工具链按需下载** —— 不带 resources/tools extraResources，
#   Node/Python/rg 首次启动时由 cloud:tools/* 按需拉取；引擎二进制仍在包内（codex-* vendor 走 asarUnpack）。
# ⛔ extraMetadata：main 钉成无头入口；version 用助手自己的版本线（不随桌面版 package.json 走）。
# ⛔⛔ 10-12 用户定调「全部拆开 —— 禁止共享数据目录和安装目录」：
#   助手包内 package.json 的 name/productName 必须**独立于桌面版**，否则：
#     ① userData 同名 ⇒ 同一个单实例锁 ⇒ 两者不能同时运行（"幽灵应用"）；
#     ② 安装目录同名 ⇒ NSIS 默认落到同一个 Programs\codex-harness-desktop，互相覆盖；
#     ③ AUMID 同名 ⇒ 任务栏分组 / 托盘图标互相顶掉。
#   name 决定 Electron 的 app.name（userData 目录名）与 NSIS 默认安装目录名。
appId: com.codexharness.assistant
productName: Codex Assistant
npmRebuild: false
extraMetadata:
  main: dist-electron/headless.js
  version: 0.0.7
  # ⛔ 这两行是「拆开」的关键：name → 独立 userData（%APPDATA%/codex-harness-assistant）
  #   + 独立安装目录（%LOCALAPPDATA%/Programs/codex-harness-assistant）；productName → 窗口/快捷方式名
  name: codex-assistant
  productName: Codex Assistant
beforePack: scripts/before-pack.cjs
directories:
  output: release-cloud
files:
  - dist/**
  - dist-electron/**
  # ⛔ 运行期 require 的 .mjs（headless→boot→delegate→dispatch-rpc→video-gen 会 require
  #   ../../src/lib/*.mjs；漏了安装后启动即崩：Cannot find module '../src/lib/video-providers.mjs'）
  - src/lib/*.mjs
  - build/tray.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - electron/ipc-channels.manifest.json
  - electron/preload.ts
  - electron/composition.json
  - package.json
  - "!dist-electron/**/*.tsbuildinfo"
asarUnpack:
  - node_modules/@openai/codex-*/vendor/**
  - node_modules/@lydell/node-pty/**
  - node_modules/sherpa-onnx-*/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
win:
  target:
    - nsis
  icon: build/icon.ico
mac:
  target:
    - zip
  # ⛔ mac 只认 .png/.svg/.icns（CI 实证：给 .ico 报 "Unsupported input format"）
  icon: build/icon.png
  category: public.app-category.developer-tools
nsis:
  oneClick: true
  runAfterFinish: true
  # ⛔⛔ 10-14：**删除 installDirectoryName** —— 该键在 electron-builder 26 的 NSIS schema
  #   里已不存在（从 node_modules/app-builder-lib/scheme.json 实测确认），带着它打包**必失败**
  #   （历史两次云发布失败 + 本次 CI 失败都是它：configuration.nsis 不符合 schema）。
  #   安装目录的"与桌面版分开"由 extraMetadata.name=codex-assistant 保证（默认目录取它）；
  #   快捷方式名与卸载项名仍显式钉死。
  shortcutName: Codex Assistant
  uninstallDisplayName: Codex Assistant
  # ⛔ 覆盖安装前强杀运行中的助手（托盘应用关不掉 ⇒ 安装器直接卡死，见 build/installer.nsh）
  include: build/installer.nsh
